name: Build and publish book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install test browser
        run: |
          npx playwright-core install --with-deps chromium
          node --input-type=module <<'JS'
          import { chromium } from 'playwright-core';
          import { appendFileSync } from 'node:fs';
          appendFileSync(process.env.GITHUB_ENV, `BROWSER_EXECUTABLE_PATH=${chromium.executablePath()}\n`);
          JS
      - name: Build editions and run tests
        run: npm test
      - name: Include project license
        run: cp LICENSE dist/site/LICENSE
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload book
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy book
        id: deployment
        uses: actions/deploy-pages@v5
