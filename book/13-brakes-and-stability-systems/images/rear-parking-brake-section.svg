<svg xmlns="http://www.w3.org/2000/svg" width="400" height="410" viewBox="102.5 70 205 210" role="img" aria-labelledby="title desc"><title id="title">Half section through the rear disc, parking shoe and hydraulic pads</title><desc id="desc">Enlarged detail of the upper axial section; the rotation axis is below the cropped view. The wheel side is left. The rear disc has two ventilated friction plates and a deep mounting hat with an internal parking drum. A fixed caliper presses pads against both outer disc faces; a mechanically actuated shoe works radially against the drum. Disc radius, thickness and overall height use 299 by 20 by 67 mm. Caliper, backing plate, small clearances and shoe details are schematic.</desc><rect width="400" height="410" fill="#fff"/><g font-family="Arial, sans-serif" fill="#243e34">
