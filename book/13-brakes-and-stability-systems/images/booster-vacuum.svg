<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1010" role="img" aria-labelledby="title desc" font-family="sans-serif">
<title id="title">Vacuum assistance and hydraulic pressure are separate</title><desc id="desc">The rear bank 4–6 exhaust camshaft drives a mechanical vacuum pump. A long air connection and non-return valve serve the front brake booster. A conceptual booster section shows an evacuated chamber and a pedal-controlled chamber admitting atmosphere during application, with a diaphragm between. The pressure difference assists the pushrod into the master cylinder; only the master cylinder and downstream pipes contain brake fluid. No vacuum level, diaphragm size, hose routing or service procedure is specified.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="1010" fill="#f1f4f2"/>
<text x="300" y="44" text-anchor="middle" font-size="27" font-weight="bold" fill="#243a32">From rear vacuum pump to front booster</text><rect x="60" y="82" width="480" height="76" rx="4" fill="#dce8e1"/><text x="300.0" y="128.32" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">Bank 4–6 exhaust camshaft</text><path d="M300 158V205" fill="none" stroke="#17654c" stroke-width="4" marker-end="url(#arrow)"/><rect x="90" y="215" width="420" height="76" rx="4" fill="#dce8e1"/><text x="300.0" y="261.32" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">Mechanical vacuum pump</text><path d="M180 410H45V320H300V297" fill="none" stroke="#28647d" stroke-width="4" marker-end="url(#arrow)"/><text x="300" y="368" text-anchor="middle" font-size="24" font-weight="normal" fill="#28647d">Air is drawn towards the pump</text>
<text x="300" y="399" text-anchor="middle" font-size="24" font-weight="normal" fill="#28647d">through a line + non-return valve</text><rect x="65" y="410" width="470" height="220" rx="34" fill="#dce8e1"/><path d="M300 419V621" stroke="#243a32" stroke-width="8"/><text x="180" y="458" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Evacuated</text>
<text x="180" y="489" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">chamber</text><text x="418" y="458" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Controlled</text>
<text x="418" y="489" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">chamber</text><path d="M570 546H485" fill="none" stroke="#28647d" stroke-width="4" marker-end="url(#arrow)"/><text x="425" y="540" text-anchor="middle" font-size="23" font-weight="normal" fill="#28647d">Atmosphere</text>
<text x="425" y="570" text-anchor="middle" font-size="23" font-weight="normal" fill="#28647d">on application</text><path d="M340 584H272" fill="none" stroke="#17654c" stroke-width="4" marker-end="url(#arrow)"/><text x="177" y="574" text-anchor="middle" font-size="23" font-weight="normal" fill="#243a32">Pressure</text>
<text x="177" y="604" text-anchor="middle" font-size="23" font-weight="normal" fill="#243a32">difference</text><text x="300" y="669" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Diaphragm assists the pushrod</text><rect x="80" y="720" width="440" height="82" rx="4" fill="#dce8e1"/><text x="300.0" y="769.32" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">Pedal + assisted pushrod</text><path d="M300 802V842" fill="none" stroke="#17654c" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="855" width="440" height="74" rx="4" fill="#dce8e1"/><text x="300.0" y="900.32" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">Master cylinder → brake fluid</text><text x="300" y="972" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Air circuit above · hydraulic circuit below</text>
</svg>
