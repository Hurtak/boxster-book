<svg xmlns="http://www.w3.org/2000/svg" width="480" height="808" viewBox="0 0 480 808" role="img" aria-labelledby="title description">
  <title id="title">From pedal force to a slowing car</title>
  <desc id="description">A conceptual sequence: pedal and booster apply force to the master cylinder; hydraulic pressure passes through the ABS and PSM unit to the calipers; pads act on discs; the tyres transmit braking force to the road. This is not a pipe-routing diagram.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#141414"/>
    </marker>
  </defs>
  <rect width="480" height="808" fill="#ffffff"/>
  <g fill="#f2f4f7">
    <rect x="24" y="16" width="432" height="96" rx="6"/>
    <rect x="24" y="148" width="432" height="96" rx="6"/>
    <rect x="24" y="280" width="432" height="96" rx="6"/>
    <rect x="24" y="412" width="432" height="96" rx="6"/>
    <rect x="24" y="544" width="432" height="96" rx="6"/>
    <rect x="24" y="676" width="432" height="96" rx="6"/>
  </g>
  <g stroke="#141414" stroke-width="2" marker-end="url(#arrow)">
    <path d="M240 118 V141"/>
    <path d="M240 250 V273"/>
    <path d="M240 382 V405"/>
    <path d="M240 514 V537"/>
    <path d="M240 646 V669"/>
  </g>
  <g fill="#141414" font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="24" font-weight="600">
      <text x="240" y="55">Pedal and booster</text>
      <text x="240" y="187">Master cylinder</text>
      <text x="240" y="319">ABS / PSM hydraulic unit</text>
      <text x="240" y="451">Calipers and pads</text>
      <text x="240" y="583">Discs and wheels</text>
      <text x="240" y="715">Tyres and road</text>
    </g>
    <g font-size="20">
      <text x="240" y="86">Apply assisted mechanical force</text>
      <text x="240" y="218">Convert force to fluid pressure</text>
      <text x="240" y="350">Regulate wheel-brake pressure</text>
      <text x="240" y="482">Turn pressure into clamping force</text>
      <text x="240" y="614">Resist rotation and absorb heat</text>
      <text x="240" y="746">Transmit the force that slows the car</text>
    </g>
    <text x="240" y="799" font-size="16" fill="#5e6268">Conceptual sequence, not hydraulic pipe routing</text>
  </g>
</svg>
