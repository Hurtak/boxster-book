<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1550" viewBox="0 0 600 1550" role="img" aria-labelledby="brake-explorer-title brake-explorer-desc" font-family="'Source Sans 3', Arial, sans-serif">
  <title id="brake-explorer-title">2010 Boxster 2.9 front brake in context</title>
  <desc id="brake-explorer-desc">A schematic master cylinder connects hydraulically to all four wheel brakes. An exploded front assembly shows the hub, disc and wheel on one axis; they rotate together and are secured by wheel bolts. A separate stationary cover plate sits behind the disc. The standard front friction ring is 318 millimetres in diameter and 28 millimetres thick, with cross-drilled faces and internal ventilation. A caliper cutaway shows two pistons on each side pushing two pads towards opposite disc faces. The black aluminium monobloc fixed caliper stays attached to the wheel carrier. Pad retaining hardware, electrical pad-wear lead and hydraulic pipe and hose are distinct neighbouring parts. Pipe routes, hydraulic circuits, the ABS/PSM unit, bolt pattern, clearances and component shapes are simplified. This is not a service sequence.</desc>
