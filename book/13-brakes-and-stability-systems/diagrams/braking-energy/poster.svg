    <text stroke="none" x="211.00" y="522" text-anchor="middle">50</text>
    <line x1="332.00" x2="332.00" y1="480.0" y2="487.0" />
    <text stroke="none" x="332.00" y="522" text-anchor="middle">100</text>
    <line x1="453.00" x2="453.00" y1="480.0" y2="487.0" />
    <text stroke="none" x="453.00" y="522" text-anchor="middle">150</text>
    <line x1="574.00" x2="574.00" y1="480.0" y2="487.0" />
    <text stroke="none" x="574.00" y="522" text-anchor="end">200</text>
  </g>
