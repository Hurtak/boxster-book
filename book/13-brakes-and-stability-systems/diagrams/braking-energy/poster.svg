    <line x1="90" x2="574" y1="280.0" y2="280.0" />
    <text stroke="none" x="80" y="289.0" text-anchor="end">2,000</text>
    <line x1="90" x2="574" y1="180.0" y2="180.0" />
    <text stroke="none" x="80" y="189.0" text-anchor="end">3,000</text>
  </g>
