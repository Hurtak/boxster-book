    <text x="320" y="363" text-anchor="end">100 km/h</text>
    <text x="320" y="405" text-anchor="end">≈540 kJ</text>
    <text x="530" y="222" text-anchor="end">200 km/h</text>
    <text x="530" y="264" text-anchor="end">≈2,160 kJ</text>
  </g>
  <text x="574" y="568" text-anchor="end" fill="#526159" font-size="28">Speed (km/h)</text>
  <g fill="#1c2823" font-size="28">
    <text x="24" y="618" font-weight="600">2× speed → 4× energy</text>
    <text x="24" y="662" font-weight="600">10% more mass → 10% more energy</text>
  </g>
  <g fill="#526159" font-size="26">
    <text x="24" y="716">E = ½mv²: kg and m/s give joules.</text>
    <text x="24" y="758">km/h ÷ 3.6 → m/s; 1 kJ = 1,000 J.</text>
    <text x="24" y="806">Illustrative mass, not a Boxster specification.</text>
    <text x="24" y="848">Wheel rotation, drag and losses are excluded.</text>
    <text x="24" y="890">No distance or temperature prediction.</text>
  </g>
</svg>
