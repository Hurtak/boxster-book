<svg xmlns="http://www.w3.org/2000/svg" width="600" height="918" viewBox="0 0 600 918" role="img" aria-labelledby="braking-energy-title braking-energy-desc" font-family="'Source Sans 3', Arial, sans-serif">
  <title id="braking-energy-title">Speed becomes heat: illustrative straight-line kinetic energy</title>
  <desc id="braking-energy-desc">At the default illustrative total mass of 1,400 kg, kinetic energy is approximately 540 kJ at 100 km/h and 2,160 kJ at 200 km/h. Doubling speed quadruples energy; adding 10 percent mass adds 10 percent energy at the same speed. This matches the interactive chart's fixed zero to 3,000 kJ scale. Energy equals one-half mass in kilograms times speed in metres per second squared, divided by 1,000 for kilojoules. This is not a measured Boxster mass or a stopping-distance or brake-temperature prediction. Wheel rotation, drag and other losses are excluded.</desc>
  <rect width="600" height="918" fill="#f1f3f2" />
  <g fill="#1c2823">
    <text x="24" y="40" font-size="32" font-weight="600">Speed becomes heat</text>
    <text x="24" y="88" font-size="28">Illustrative total mass: 1,400 kg</text>
  </g>
  <text x="24" y="136" fill="#526159" font-size="26">Kinetic energy (kJ) · fixed scale</text>
