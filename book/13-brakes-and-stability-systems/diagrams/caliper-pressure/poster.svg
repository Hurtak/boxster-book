<svg xmlns="http://www.w3.org/2000/svg" font-family="'Source Sans 3', Arial, sans-serif" role="img" aria-label="Four-piston fixed caliper with pads on both sides of the disc" viewBox="0 0 360 520" width="360" height="520"><title>Four-piston aluminium monobloc fixed caliper</title><desc>Two pistons on each side press a pad against a ventilated disc. Connected fluid chambers share pressure p. Each piston force is p times its area; each pad receives p times the sum of its two piston areas. Applied at 50 percent of an illustrative pressure range; arrows point inward.</desc><path d="M56,298 V82 H304 V298" fill="none" stroke="#22272d" stroke-width="20" stroke-linejoin="round"></path><path d="M180,48 V82 M56,247 V82 H304 V247" fill="none" stroke="rgb(99, 145, 207)" stroke-width="5"></path><text x="164" y="22" text-anchor="end" font-size="15" fill="#363c44">One-piece</text><text x="164" y="44" text-anchor="end" font-size="15" fill="#363c44">fixed body</text><path d="M98,51 V70" fill="none" stroke="#526159" stroke-width="1.5"></path><text x="192" y="40" text-anchor="start" font-size="15" fill="#363c44">Fluid pressure p</text><text x="192" y="62" text-anchor="start" font-size="15" fill="#363c44">50% relative</text><rect x="167" y="106" width="26" height="208" fill="#9ba5b3"></rect><rect x="176" y="106" width="8" height="208" fill="#eef1f4"></rect><path d="M176,116 H184" fill="none" stroke="#9ba5b3" stroke-width="4"></path><path d="M176,146 H184" fill="none" stroke="#9ba5b3" stroke-width="4"></path><path d="M176,176 H184" fill="none" stroke="#9ba5b3" stroke-width="4"></path><path d="M176,206 H184" fill="none" stroke="#9ba5b3" stroke-width="4"></path><path d="M176,236 H184" fill="none" stroke="#9ba5b3" stroke-width="4"></path><path d="M176,266 H184" fill="none" stroke="#9ba5b3" stroke-width="4"></path><path d="M176,296 H184" fill="none" stroke="#9ba5b3" stroke-width="4"></path><rect x="154" y="126" width="13" height="162" fill="#b0764d"></rect><rect x="148" y="126" width="6" height="162" fill="#22272d"></rect><rect x="56" y="154" width="42" height="30" fill="rgb(99, 145, 207)"></rect><rect x="98" y="154" width="50" height="30" rx="2" fill="#9ba5b3" stroke="#526159"></rect><path d="M128,150 H46 V188 H128" fill="none" stroke="#22272d" stroke-width="4"></path><text x="121" y="209" text-anchor="middle" font-size="15" fill="#363c44">A₁</text><path d="M123,169 H143" fill="none" stroke="#9d3e2c" stroke-width="2.5"></path><path d="M143,169 L139,165 L139,173 Z" fill="#9d3e2c"></path><rect x="56" y="232" width="42" height="30" fill="rgb(99, 145, 207)"></rect><rect x="98" y="232" width="50" height="30" rx="2" fill="#9ba5b3" stroke="#526159"></rect><path d="M128,228 H46 V266 H128" fill="none" stroke="#22272d" stroke-width="4"></path><text x="121" y="287" text-anchor="middle" font-size="15" fill="#363c44">A₂</text><path d="M123,247 H143" fill="none" stroke="#9d3e2c" stroke-width="2.5"></path><path d="M143,247 L139,243 L139,251 Z" fill="#9d3e2c"></path><rect x="193" y="126" width="13" height="162" fill="#b0764d"></rect><rect x="206" y="126" width="6" height="162" fill="#22272d"></rect><rect x="262" y="154" width="42" height="30" fill="rgb(99, 145, 207)"></rect><rect x="212" y="154" width="50" height="30" rx="2" fill="#9ba5b3" stroke="#526159"></rect><path d="M232,150 H314 V188 H232" fill="none" stroke="#22272d" stroke-width="4"></path><text x="239" y="209" text-anchor="middle" font-size="15" fill="#363c44">A₁</text><path d="M237,169 H217" fill="none" stroke="#9d3e2c" stroke-width="2.5"></path><path d="M217,169 L221,165 L221,173 Z" fill="#9d3e2c"></path><rect x="262" y="232" width="42" height="30" fill="rgb(99, 145, 207)"></rect><rect x="212" y="232" width="50" height="30" rx="2" fill="#9ba5b3" stroke="#526159"></rect><path d="M232,228 H314 V266 H232" fill="none" stroke="#22272d" stroke-width="4"></path><text x="239" y="287" text-anchor="middle" font-size="15" fill="#363c44">A₂</text><path d="M237,247 H217" fill="none" stroke="#9d3e2c" stroke-width="2.5"></path><path d="M217,247 L221,243 L221,251 Z" fill="#9d3e2c"></path><text x="76" y="326" text-anchor="middle" font-size="15" fill="#363c44">2 pistons</text><text x="284" y="326" text-anchor="middle" font-size="15" fill="#363c44">2 pistons</text><text x="110" y="349" text-anchor="middle" font-size="15" fill="#363c44">Pad</text><text x="250" y="349" text-anchor="middle" font-size="15" fill="#363c44">Pad</text><path d="M110,333 L160,286" fill="none" stroke="#526159" stroke-width="1.5"></path><path d="M250,333 L200,286" fill="none" stroke="#526159" stroke-width="1.5"></path><text x="180" y="374" text-anchor="middle" font-size="15" fill="#363c44">Ventilated disc</text><path d="M180,316 V355" fill="none" stroke="#526159" stroke-width="1.5"></path><text x="180" y="412" text-anchor="middle" font-size="15" fill="#363c44">Each pad: F = p(A₁ + A₂)</text><text x="180" y="434" text-anchor="middle" font-size="15" fill="#363c44">Arrows: inward piston force</text><text x="180" y="466" text-anchor="middle" font-size="15" fill="#363c44">Connected chambers share p.</text><text x="180" y="487" text-anchor="middle" font-size="15" fill="#363c44">Each piston: F = pA.</text><text x="180" y="508" text-anchor="middle" font-size="15" fill="#363c44">Schematic; 50% is not bar or pedal travel.</text></svg>
