<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">One engine, three acceleration entries</title>
  <desc id="desc">Manual 5.9 seconds; PDK 5.8 seconds; PDK with Sport Chrono SPORT PLUS 5.6 seconds to 100 kilometres per hour. All retain 188 kilowatts or 255 PS. Manual selected.</desc>
  <rect width="600" height="400" fill="#f2f4ee"/>
  <g font-family="sans-serif" fill="#233e32">
    <text x="24" y="42" font-size="25">0–100 km/h · quoted time</text>
    <text x="24" y="92" font-size="23">Manual · selected</text><text x="575" y="92" font-size="25" text-anchor="end">5.9 s</text>
    <rect x="24" y="105" width="463" height="25" fill="#176b53" stroke="#233e32" stroke-width="2"/>
    <text x="24" y="171" font-size="23">PDK</text><text x="575" y="171" font-size="25" text-anchor="end">5.8 s</text>
    <rect x="24" y="184" width="455" height="25" fill="#b9c8be"/>
    <text x="24" y="250" font-size="23">PDK + Chrono SPORT PLUS</text><text x="575" y="250" font-size="25" text-anchor="end">5.6 s</text>
    <rect x="24" y="263" width="439" height="25" fill="#b9c8be"/>
    <text x="24" y="333" font-size="25">All three: 188 kW / 255 PS</text>
    <text x="24" y="372" font-size="22">Manual DIN baseline: 1,335 kg</text>
  </g>
</svg>
