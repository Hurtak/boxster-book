<svg xmlns="http://www.w3.org/2000/svg" width="600" height="570" viewBox="0 0 600 570" role="img" aria-labelledby="title desc">
  <title id="title">One engine, three acceleration entries</title>
  <desc id="desc">Quoted 0–100 km/h times on a scale starting at zero: manual 5.9 seconds; PDK 5.8 seconds; PDK with Sport Chrono or Sport Chrono Plus, using SPORT PLUS, 5.6 seconds. Shorter bars mean quicker. All retain 188 kilowatts or 255 PS. Manual selected, with a 1,335 kg DIN catalogue baseline, not an optioned-car measurement.</desc>
  <rect width="600" height="570" fill="#f2f4ee"/>
  <g font-family="'Source Sans 3', sans-serif" fill="#233e32">
    <text x="24" y="42" font-size="30">0–100 km/h · quoted time</text>
    <text x="24" y="84" font-size="26">Shorter bars mean quicker</text>
    <text x="24" y="127" font-size="28">Manual · selected</text><text x="575" y="127" font-size="30" text-anchor="end">5.9 s</text>
    <rect x="24" y="140" width="464.4" height="25" fill="#176b53" stroke="#233e32" stroke-width="2"/>
    <text x="24" y="209" font-size="28">PDK</text><text x="575" y="209" font-size="30" text-anchor="end">5.8 s</text>
    <rect x="24" y="222" width="456.5" height="25" fill="#b9c8be"/>
    <text x="24" y="291" font-size="28">PDK + Sport Chrono</text><text x="575" y="291" font-size="30" text-anchor="end">5.6 s</text>
    <text x="24" y="334" font-size="26">SPORT PLUS</text>
    <rect x="24" y="347" width="440.8" height="25" fill="#b9c8be"/>
    <g stroke="#526159">
      <path d="M24 400H575 M24 400v8 M181.4 400v8 M338.9 400v8 M496.3 400v8" fill="none"/>
    </g>
    <g font-size="26" fill="#526159">
      <text x="24" y="438">0 s</text><text x="181.4" y="438" text-anchor="middle">2</text><text x="338.9" y="438" text-anchor="middle">4</text><text x="496.3" y="438" text-anchor="middle">6</text>
    </g>
    <text x="24" y="488" font-size="28">All three: 188 kW / 255 PS</text>
    <text x="24" y="535" font-size="28">Manual DIN baseline: 1,335 kg</text>
  </g>
</svg>
