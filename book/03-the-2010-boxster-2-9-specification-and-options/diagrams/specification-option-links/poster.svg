<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
  <title id="title">PDK and Sport Chrono work together</title>
  <desc id="desc">For the January 2010 UK Boxster 2.9, both PDK and Sport Chrono are needed for Launch Control and the SPORT PLUS shift strategy. Basic Chrono 639 does not need PCM; Plus 640 does. This selected relationship is not an individual car's build record.</desc>
  <rect width="360" height="420" fill="#f2f4ee"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#233e32">
    <rect x="10" y="12" width="340" height="76" fill="#e1e8df"/>
    <text x="180" y="42" font-size="22">PDK</text><text x="180" y="71" font-size="20">7-speed · 250</text>
    <text x="180" y="114" font-size="18">AND</text>
    <rect x="10" y="128" width="340" height="76" fill="#e1e8df"/>
    <text x="180" y="158" font-size="22">Sport Chrono</text><text x="180" y="187" font-size="20">639 or Plus 640</text>
    <text x="180" y="234" font-size="18">BOTH ENABLE ↓</text>
    <rect x="10" y="252" width="340" height="102" fill="#176b53"/>
    <text x="180" y="274" font-size="14" fill="white">FUNCTIONS</text>
    <text x="180" y="304" font-size="22" fill="white">Launch Control</text><text x="180" y="335" font-size="20" fill="white">SPORT PLUS shift strategy</text>
    <text x="180" y="382" font-size="16">Plus 640 also requires PCM.</text>
    <text x="180" y="406" font-size="14">January 2010 UK · selected relationship</text>
  </g>
</svg>
