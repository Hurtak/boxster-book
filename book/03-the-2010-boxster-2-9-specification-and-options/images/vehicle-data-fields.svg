<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-labelledby="title desc"><title id="title">Reading a vehicle-data record</title><desc id="desc">Original explanatory section; profiles and spacing are schematic.</desc><defs><marker id="arrow-2c7895" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2c7895"/></marker><marker id="back-2c7895" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2c7895"/></marker><marker id="arrow-176b53" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176b53"/></marker><marker id="back-176b53" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176b53"/></marker><marker id="arrow-ad622d" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad622d"/></marker><marker id="back-ad622d" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad622d"/></marker><marker id="arrow-243e34" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#243e34"/></marker><marker id="back-243e34" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#243e34"/></marker></defs><rect width="800" height="550" fill="#f5f6ef"/><g font-family="'Source Sans 3', Arial, sans-serif" fill="#243e34"><text x="28" y="43" font-size="29" fill="#243e34" text-anchor="start" font-weight="600">Reading a vehicle-data record</text><rect x="35" y="83" width="452" height="366" rx="3" fill="#fff" stroke="#243e34" stroke-width="2"/><text x="58" y="119" font-size="22" fill="#243e34" text-anchor="start" font-weight="600">ILLUSTRATIVE VEHICLE DATA</text><text x="58" y="160" font-size="17" fill="#5b7166" text-anchor="start">VIN</text><text x="58" y="184" font-size="21" fill="#243e34" text-anchor="start">WP0 … [identity omitted]</text><text x="58" y="219" font-size="17" fill="#5b7166" text-anchor="start">TYPE</text><text x="58" y="243" font-size="21" fill="#243e34" text-anchor="start">987 · Boxster</text><text x="58" y="278" font-size="17" fill="#5b7166" text-anchor="start">ENGINE / GEARBOX</text><text x="58" y="302" font-size="21" fill="#243e34" text-anchor="start">MA120 / G87.10</text><text x="58" y="337" font-size="17" fill="#5b7166" text-anchor="start">PAINT / TRIM</text><text x="58" y="361" font-size="21" fill="#243e34" text-anchor="start">[car-specific codes]</text><text x="58" y="396" font-size="17" fill="#5b7166" text-anchor="start">EQUIPMENT</text><text x="58" y="420" font-size="21" fill="#243e34" text-anchor="start">[car-specific PR codes]</text><path d="M488 176H512" stroke="#176b53" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="526" y="183" font-size="18" fill="#243e34" text-anchor="start">Identity, not first registration</text><path d="M488 235H512" stroke="#176b53" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="526" y="242" font-size="18" fill="#243e34" text-anchor="start">Model/type record</text><path d="M488 294H512" stroke="#176b53" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="526" y="301" font-size="18" fill="#243e34" text-anchor="start">Engine and transmission</text><path d="M488 353H512" stroke="#176b53" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="526" y="360" font-size="18" fill="#243e34" text-anchor="start">Colour and interior</text><path d="M488 412H512" stroke="#176b53" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><text x="526" y="419" font-size="18" fill="#243e34" text-anchor="start">Decode each code separately</text><text x="35" y="492" font-size="22" fill="#243e34" text-anchor="start">A guide to fields, not a facsimile of a particular car’s sticker.</text><text x="35" y="525" font-size="21" fill="#5c7166" text-anchor="start">Sales option codes and PET production codes are different lists.</text></g></svg>
