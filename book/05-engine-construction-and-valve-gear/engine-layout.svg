<title id="title">The 2010 Boxster 2.9 flat-six layout</title><desc id="desc">A schematic plan places three cylinders on either side of a central crankshaft, with a cylinder head and two camshafts outside each bank. Connecting rods link the pistons to separate crank throws. The geometry is not a measured engine drawing.</desc>
