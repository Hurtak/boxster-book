<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 950" role="img" aria-labelledby="title desc">
<title id="title">The Boxster 2.9 flat-six: layout and crank connection</title>
<desc id="desc">A simplified plan viewed from above shows three cylinders in each staggered bank, one outer head per bank and two overhead camshafts per head. Each piston has a rod connected to its own crankpin. The plan projects all six crankpins onto the central shaft axis and does not depict crank phasing. A separate generic cross-section shows the piston pin, connecting rod, offset crankpin and crankshaft rotation axis. Camshafts are separated for clarity. Vehicle front and rear, valve positions, dimensions and actual crank angles are not assigned.</desc>
<defs>
  <marker id="layout-travel-arrow" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto-start-reverse"><path d="M0 0 5 2.5 0 5z" fill="#526e5c"/></marker>
</defs>
<rect width="420" height="950" fill="#f5f3eb"/>
<g font-family="sans-serif" fill="#243f33" text-anchor="middle">
  <text x="210" y="32" font-size="25" font-weight="700">The 2.9 flat-six</text>
  <text x="210" y="60" font-size="20">Three cylinders in each bank</text>
  <text x="210" y="92" font-size="19" font-weight="700">1 · Plan view: looking down</text>
  <text x="210" y="116" font-size="17">Vehicle front and rear not assigned</text>

  <!-- This is a component layout, not a crankshaft-angle projection. -->
  <g fill="#b4c9ba" stroke="#526e5c" stroke-width="2">
    <rect x="20" y="146" width="48" height="270" rx="6"/>
    <rect x="352" y="146" width="48" height="270" rx="6"/>
  </g>
  <path d="M35 157V405 M53 157V405 M367 157V405 M385 157V405" fill="none" stroke="#335f4b" stroke-width="6"/>
  <g fill="#e2e7df" stroke="#81958a" stroke-width="2">
    <path d="M68 150H173V206H68z M68 243H173V299H68z M68 336H173V392H68z"/>
    <path d="M247 168H352V224H247z M247 261H352V317H247z M247 354H352V410H247z"/>
  </g>
  <path d="M210 143V422" fill="none" stroke="#ad713a" stroke-width="15"/>
  <!-- Six distinct projected rod joints; no opposing pair shares a pin. -->
  <g stroke="#6e8678" stroke-width="9" stroke-linecap="round">
    <path d="M135 178H210 M135 271H210 M135 364H210 M285 196H210 M285 289H210 M285 382H210"/>
  </g>
  <g fill="#718e7c" stroke="#294c39" stroke-width="2">
    <path d="M119 154H143V202H119z M119 247H143V295H119z M119 340H143V388H119z"/>
    <path d="M277 172H301V220H277z M277 265H301V313H277z M277 358H301V406H277z"/>
  </g>
  <g fill="none" stroke="#294c39" stroke-width="2">
    <path d="M124 155V201 M128 155V201 M124 248V294 M128 248V294 M124 341V387 M128 341V387 M292 173V219 M296 173V219 M292 266V312 M296 266V312 M292 359V405 M296 359V405"/>
  </g>
  <g fill="#f5f3eb" stroke="#294c39" stroke-width="2">
    <circle cx="135" cy="178" r="4"/><circle cx="135" cy="271" r="4"/><circle cx="135" cy="364" r="4"/>
    <circle cx="285" cy="196" r="4"/><circle cx="285" cy="289" r="4"/><circle cx="285" cy="382" r="4"/>
  </g>
  <g fill="#ad713a" stroke="#294c39" stroke-width="3">
    <circle cx="210" cy="178" r="7"/><circle cx="210" cy="196" r="7"/>
    <circle cx="210" cy="271" r="7"/><circle cx="210" cy="289" r="7"/>
    <circle cx="210" cy="364" r="7"/><circle cx="210" cy="382" r="7"/>
  </g>
  <text x="44" y="139" font-size="19">Head</text>
  <text x="376" y="139" font-size="19">Head</text>
  <text x="210" y="447" font-size="20" font-weight="700">Crankshaft</text>
  <text x="210" y="475" font-size="19">Two overhead cams/head (separated)</text>
  <text x="210" y="504" font-size="19">Six rods use six separate crankpins.</text>
  <text x="210" y="531" font-size="19">Opposed banks are staggered.</text>
  <text x="210" y="556" font-size="17">Crankpins project onto the shaft axis here;</text>
  <text x="210" y="578" font-size="17">their angular positions are not shown.</text>

  <path d="M24 596H396" stroke="#b4c9ba" stroke-width="2"/>
  <text x="210" y="625" font-size="21" font-weight="700">2 · One rod and offset crankpin</text>
  <text x="210" y="651" font-size="18">Across the shaft · generic cross-section</text>

  <!-- One-cylinder slider-crank detail, deliberately not a MA120 crank angle. -->
  <rect x="24" y="704" width="44" height="90" rx="4" fill="#b4c9ba" stroke="#526e5c" stroke-width="2"/>
  <path d="M68 718H220 M68 782H220" fill="none" stroke="#81958a" stroke-width="5"/>
  <path d="M69 721H132V779H69z" fill="#e2e7df"/>
  <path d="M68 750H353" stroke="#81958a" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="319" cy="750" r="40" fill="none" stroke="#ad713a" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M319 750 299 715" stroke="#ad713a" stroke-width="17" stroke-linecap="round"/>
  <path d="M148 750 299 715" stroke="#6e8678" stroke-width="11" stroke-linecap="round"/>
  <rect x="132" y="722" width="30" height="56" fill="#718e7c" stroke="#294c39" stroke-width="2"/>
  <path d="M137 723V777 M142 723V777" stroke="#294c39" stroke-width="2"/>
  <circle cx="148" cy="750" r="6" fill="#f5f3eb" stroke="#294c39" stroke-width="2"/>
  <circle cx="299" cy="715" r="12" fill="#6e8678" stroke="#294c39" stroke-width="2"/>
  <circle cx="299" cy="715" r="7" fill="#ad713a" stroke="#294c39" stroke-width="2"/>
  <circle cx="319" cy="750" r="5" fill="#f5f3eb" stroke="#ad713a" stroke-width="3"/>
  <path d="M111 798H186" fill="none" stroke="#526e5c" stroke-width="2" marker-start="url(#layout-travel-arrow)" marker-end="url(#layout-travel-arrow)"/>
  <g fill="none" stroke="#526e5c" stroke-width="1.5">
    <path d="M146 690V720 M304 690 300 701 M46 797V813 M230 731 243 765V813 M324 751 350 793V813"/>
  </g>
  <text x="146" y="684" font-size="19">Piston</text>
  <text x="304" y="684" font-size="19">Crankpin</text>
  <text x="46" y="834" font-size="19">Head</text>
  <text x="243" y="834" font-size="19">Rod</text>
  <text x="350" y="834" font-size="19">Shaft axis</text>
  <text x="210" y="863" font-size="19">Rod pivots at the piston pin.</text>
  <text x="210" y="889" font-size="18">Its big end follows the offset crankpin.</text>
  <text x="210" y="920" font-size="17">Schematic: no valve positions, crank phasing</text>
  <text x="210" y="942" font-size="17">or assembly dimensions are specified.</text>
</g>
</svg>
