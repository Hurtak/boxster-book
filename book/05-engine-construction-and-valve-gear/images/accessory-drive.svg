<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title desc" font-family="sans-serif">
<title id="title">One external drive, four accessory loads</title><desc id="desc">Functional diagram: the crankshaft pulley supplies a common double-sided poly-V belt. The belt drives the alternator, hydraulic steering pump, air-conditioning compressor and coolant pump. A hydraulic tensioner maintains loading and damps belt vibration. Timing chains and the camshaft-driven vacuum pump are separate drives. Connections are not physical belt routing or pulley sizes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="760" fill="#f1f4f2"/>
<text x="300" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#243a32">One belt, four accessory loads</text><rect x="100" y="80" width="400" height="76" rx="4" fill="#dce8e1"/><text x="300.0" y="126.32" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">Crankshaft pulley</text><path d="M300 156V192" fill="none" stroke="#17654c" stroke-width="4" marker-end="url(#arrow)"/><rect x="90" y="200" width="420" height="80" rx="4" fill="#dce8e1"/><text x="300.0" y="231.82" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">Double-sided poly-V belt</text>
<text x="300.0" y="264.82" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">with hydraulic tensioner</text><path d="M300 280V322H65V594H300V635M300 322H535V594H300" fill="none" stroke="#17654c" stroke-width="6"/><rect x="110" y="340" width="380" height="74" rx="4" fill="#dce8e1"/><text x="300.0" y="385.32" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">Alternator → electrical supply</text><path d="M65 377H103" fill="none" stroke="#17654c" stroke-width="4" marker-end="url(#arrow)"/><rect x="110" y="430" width="380" height="74" rx="4" fill="#dce8e1"/><text x="300.0" y="475.32" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">Steering pump → assistance</text><path d="M65 467H103" fill="none" stroke="#17654c" stroke-width="4" marker-end="url(#arrow)"/><rect x="110" y="520" width="380" height="74" rx="4" fill="#dce8e1"/><text x="300.0" y="565.32" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">A/C compressor → refrigerant</text><path d="M65 557H103" fill="none" stroke="#17654c" stroke-width="4" marker-end="url(#arrow)"/><rect x="110" y="610" width="380" height="74" rx="4" fill="#dce8e1"/><text x="300.0" y="655.32" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">Coolant pump → circulation</text><path d="M300 594V605" fill="none" stroke="#17654c" stroke-width="4" marker-end="url(#arrow)"/><text x="300" y="721" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Functional links · not belt routing</text>
</svg>
