<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 565" role="img" aria-labelledby="title desc">
<title id="title">Direct chain drive without an intermediate shaft</title><desc id="desc">The crankshaft drives two chains, one for each cylinder bank's inlet and exhaust camshafts. Guide rails control the path and hydraulic tensioners press tensioning rails against the chains. This is a connection schematic, not the physical chain routing.</desc>
<rect width="420" height="565" fill="#f5f3eb"/>
<g font-family="sans-serif" fill="#243f33" text-anchor="middle">
<text x="210" y="31" font-size="23" font-weight="700">One crankshaft, four cams</text>
<text x="210" y="58" font-size="18">2010 2.9 · two timing chains</text>
<text x="104" y="91" font-size="18">One bank</text><text x="316" y="91" font-size="18">Other bank</text>
<g fill="#d2e1d5" stroke="#345e49" stroke-width="3"><circle cx="64" cy="137" r="28"/><circle cx="144" cy="137" r="28"/><circle cx="276" cy="137" r="28"/><circle cx="356" cy="137" r="28"/></g>
<g font-size="20"><text x="64" y="144">I</text><text x="144" y="144">E</text><text x="276" y="144">I</text><text x="356" y="144">E</text></g>
<path d="M64 104H144Q177 104 177 137L233 325Q240 361 209 362Q186 362 181 336L34 153Q20 104 64 104Z" fill="none" stroke="#b07d38" stroke-width="5"/>
<path d="M276 104H356Q401 104 386 153L239 336Q234 362 211 362Q180 361 187 325L243 137Q243 104 276 104Z" fill="none" stroke="#b07d38" stroke-width="5" stroke-dasharray="9 4"/>
<circle cx="210" cy="334" r="25" fill="#b07d38" stroke="#604626" stroke-width="3"/>
<circle cx="210" cy="334" r="7" fill="#f5f3eb"/>
<path d="M48 189L112 269 M372 189L308 269" stroke="#526f60" stroke-width="11" stroke-linecap="round"/>
<path d="M48 253H84 M336 253H372" stroke="#3c7592" stroke-width="10"/>
<text x="210" y="390" font-size="20" font-weight="700">Crankshaft</text>
<text x="210" y="417" font-size="18">2 crank turns = 1 cam turn</text>
<text x="210" y="444" font-size="18">I = inlet · E = exhaust</text>
<text x="210" y="471" font-size="18">Green rails guide the chain path.</text>
<text x="210" y="496" font-size="18">Blue: oil-fed hydraulic tensioners</text>
<text x="210" y="521" font-size="18">act through tensioning rails.</text>
<text x="210" y="552" font-size="18">Connections only · not physical routing</text>
</g></svg>
