<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 885" role="img" aria-labelledby="title desc">
<title id="title">VarioCam Plus inlet timing and two-stage lift</title>
<desc id="desc">For the 2010 Boxster 2.9, a vane adjuster changes inlet cam phase over 40 degrees of crank angle, equivalent to 20 degrees at the half-speed camshaft. The upper plot compares the same profile at reference and advanced timing. The lower plot compares the documented 3.6 and 10.0 millimetre peak inlet lifts. A functional connection shows the vane adjuster, cam profiles and inlet valve. Curves, equal durations and mechanism symbols are illustrative, not measured valve profiles or ECU thresholds. Crank angle has no TDC reference here.</desc>
<rect width="420" height="885" fill="#f5f3eb"/>
<g font-family="'Source Sans 3', sans-serif" fill="#263d34">
<text x="210" y="34" text-anchor="middle" font-size="25" font-weight="700">Timing and lift</text>
<text x="210" y="65" text-anchor="middle" font-size="21">2010 Boxster 2.9 · inlet valves</text>
<text x="24" y="110" font-size="23" font-weight="700">1  Timing changes when</text>
<path d="M27 138H55" stroke="#87988c" stroke-width="3" stroke-dasharray="5 5"/>
<text x="64" y="144" font-size="19">Reference</text>
<path d="M230 138H258" stroke="#176b53" stroke-width="4"/>
<text x="267" y="144" font-size="19">Advanced</text>
<path d="M40 270H386M40 178V270" stroke="#87988c" fill="none" stroke-width="2"/>
<path d="M137 269C162 269 169 190 225 190S288 269 315 269" fill="none" stroke="#87988c" stroke-width="3" stroke-dasharray="6 5"/>
<path d="M77 269C102 269 109 190 165 190S228 269 255 269" fill="none" stroke="#176b53" stroke-width="4"/>
<path d="M225 169H165m10-6-10 6 10 6" stroke="#176b53" stroke-width="3" fill="none"/>
<text x="210" y="302" text-anchor="middle" font-size="20">Earlier ← crank angle → later</text>
<text x="210" y="333" text-anchor="middle" font-size="20">40° crank range = 20° cam range</text>
<text x="210" y="366" text-anchor="middle" font-size="20">The same profile moves earlier as a whole.</text>

<text x="24" y="408" font-size="23" font-weight="700">2  Lift selects a profile</text>
<path d="M40 555H386M40 435V555" stroke="#87988c" fill="none" stroke-width="2"/>
<path d="M85 554C110 554 130 450 212 450S314 554 339 554" fill="none" stroke="#176b53" stroke-width="4"/>
<path d="M85 554C110 554 130 517 212 517S314 554 339 554" fill="none" stroke="#a4712f" stroke-width="4"/>
<text x="55" y="590" font-size="22" fill="#a4712f">3.6 mm low</text>
<text x="235" y="590" font-size="22" fill="#176b53">10.0 mm high</text>
<text x="210" y="623" text-anchor="middle" font-size="20">Two documented peak inlet lifts.</text>

<text x="24" y="671" font-size="23" font-weight="700">Functional connection</text>
<g fill="none" stroke="#87988c" stroke-width="2">
<path d="M104 721H168m-7-5 7 5-7 5M253 721H319m-7-5 7 5-7 5"/>
<circle cx="69" cy="721" r="27" fill="#e4e9e2" stroke-width="3"/>
<path d="M69 696V684" stroke-dasharray="3 3"/>
</g>
<path d="M69 699V743M47 721H91" stroke="#176b53" stroke-width="7"/>
<circle cx="69" cy="721" r="7" fill="#176b53"/>
<path d="M193 741C173 741 177 719 193 708C209 719 213 741 193 741Z" fill="#a4712f"/>
<path d="M227 741C205 741 207 717 227 696C247 717 249 741 227 741Z" fill="#176b53"/>
<path d="M350 697V744M333 744H367" stroke="#176b53" stroke-width="3"/>
<path d="M333 721H367" stroke="#87988c" stroke-width="2" stroke-dasharray="4 3"/>
<g font-size="20" text-anchor="middle">
<text x="69" y="778">Vane adjuster</text>
<text x="210" y="778">Cam profiles</text>
<text x="350" y="778">Inlet valve</text>
<text x="210" y="813">Oil changes phase; profile choice sets lift.</text>
</g>
<g font-size="19" text-anchor="middle" fill="#526159">
<text x="210" y="843">Curves, durations and symbols are illustrative.</text>
<text x="210" y="877">No TDC reference or ECU thresholds shown.</text>
</g>
</g>
</svg>
