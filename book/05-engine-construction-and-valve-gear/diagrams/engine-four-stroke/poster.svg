<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" role="img" aria-labelledby="title desc">
  <title id="title">The Boxster 2.9’s four-stroke cycle</title>
  <desc id="desc">A port injector supplies the inlet. Intake occupies zero to 180 degrees, compression 180 to 360, power 360 to 540, and exhaust 540 to 720. Arrows outside the cylinders show piston travel; arrows at the valves show gas flow. A spark near compression top dead centre starts combustion. The crank turns twice while each cam turns once. The upright cylinders, valve events and spark position are explanatory, not measured Porsche timing.</desc>
  <rect width="420" height="800" fill="#f5f3eb"/>
  <g font-family="sans-serif" fill="#243f33">
    <text x="210" y="34" text-anchor="middle" font-size="24" font-weight="700">Four strokes, two turns</text>
    <text x="210" y="60" text-anchor="middle" font-size="18">MY2010 Boxster 2.9 · port injection</text>
    <text x="210" y="85" text-anchor="middle" font-size="16">One cylinder shown upright for clarity</text>

    <g transform="translate(20 113)">
      <path d="M8 26h82v88H8z" fill="#dce7ec" stroke="#758c7d" stroke-width="3"/>
      <path d="M5 14h88v12H5z" fill="#b9c8bd"/>
      <path d="M-3 21H30V26 M101 21H68V26" fill="none" stroke="#f5f3eb" stroke-width="10"/>
      <path d="M30 0v36m-10 0h20 M68 0v26m-10 0h20" fill="none" stroke="#243f33" stroke-width="3"/>
      <path d="M49 0v29" stroke="#a29e84" stroke-width="5"/>
      <path d="M49 0v31" stroke="#243f33" stroke-width="1.5"/>
      <path d="M1 2l12 13" stroke="#86613b" stroke-width="6"/>
      <path d="M-5 21H33v6l11 5v18m-5-7 5 7 5-7" fill="none" stroke="#306b95" stroke-width="3"/>
      <rect x="12" y="78" width="74" height="18" rx="2" fill="#a5b6ad" stroke="#243f33" stroke-width="2"/>
      <path d="M13 83h72" stroke="#243f33" stroke-width="1.5"/>
      <path d="M110 53v38m-5-7 5 7 5-7" fill="none" stroke="#566e60" stroke-width="3"/>
    </g>
    <text x="143" y="134" font-size="21" font-weight="700">1 · Intake</text>
    <text x="143" y="160" font-size="17">0–180° · piston away</text>
    <text x="143" y="189" font-size="17">Inlet open; charge enters.</text>
    <text x="143" y="214" font-size="17">Fuel enters in the port.</text>
    <path d="M20 249h380" stroke="#c8cfc5"/>

    <g transform="translate(20 261)">
      <path d="M8 26h82v88H8z" fill="#ece5d7" stroke="#758c7d" stroke-width="3"/>
      <path d="M5 14h88v12H5z" fill="#b9c8bd"/>
      <path d="M30 0v26m-10 0h20 M68 0v26m-10 0h20" fill="none" stroke="#243f33" stroke-width="3"/>
      <path d="M49 0v29" stroke="#a29e84" stroke-width="5"/>
      <path d="M49 0v31" stroke="#243f33" stroke-width="1.5"/>
      <path d="M49 31l-4 7 5-2-3 9 9-10-5 2 3-6" fill="#d39720"/>
      <rect x="12" y="49" width="74" height="18" rx="2" fill="#a5b6ad" stroke="#243f33" stroke-width="2"/>
      <path d="M13 54h72" stroke="#243f33" stroke-width="1.5"/>
      <path d="M110 91V53m-5 7 5-7 5 7" fill="none" stroke="#566e60" stroke-width="3"/>
    </g>
    <text x="143" y="282" font-size="21" font-weight="700">2 · Compression</text>
    <text x="143" y="308" font-size="17">180–360° · piston returns</text>
    <text x="143" y="337" font-size="17">Both valves closed.</text>
    <text x="143" y="362" font-size="17">Spark near the end.*</text>
    <path d="M20 397h380" stroke="#c8cfc5"/>

    <g transform="translate(20 409)">
      <path d="M8 26h82v88H8z" fill="#eddbd3" stroke="#758c7d" stroke-width="3"/>
      <path d="M5 14h88v12H5z" fill="#b9c8bd"/>
      <path d="M30 0v26m-10 0h20 M68 0v26m-10 0h20" fill="none" stroke="#243f33" stroke-width="3"/>
      <path d="M49 0v29" stroke="#a29e84" stroke-width="5"/>
      <path d="M49 0v31" stroke="#243f33" stroke-width="1.5"/>
      <path d="M32 73Q22 59 40 45Q40 58 49 37Q69 49 60 61Q78 55 69 73Z" fill="#ce7840" opacity=".8"/>
      <rect x="12" y="78" width="74" height="18" rx="2" fill="#a5b6ad" stroke="#243f33" stroke-width="2"/>
      <path d="M13 83h72" stroke="#243f33" stroke-width="1.5"/>
      <path d="M110 53v38m-5-7 5 7 5-7" fill="none" stroke="#566e60" stroke-width="3"/>
    </g>
    <text x="143" y="430" font-size="21" font-weight="700">3 · Power</text>
    <text x="143" y="456" font-size="17">360–540° · piston away</text>
    <text x="143" y="485" font-size="17">Both valves closed.</text>
    <text x="143" y="510" font-size="17">Expanding gas does work.</text>
    <path d="M20 545h380" stroke="#c8cfc5"/>

    <g transform="translate(20 557)">
      <path d="M8 26h82v88H8z" fill="#e4e1e6" stroke="#758c7d" stroke-width="3"/>
      <path d="M5 14h88v12H5z" fill="#b9c8bd"/>
      <path d="M-3 21H30V26 M101 21H68V26" fill="none" stroke="#f5f3eb" stroke-width="10"/>
      <path d="M30 0v26m-10 0h20 M68 0v36m-10 0h20" fill="none" stroke="#243f33" stroke-width="3"/>
      <path d="M49 0v29" stroke="#a29e84" stroke-width="5"/>
      <path d="M49 0v31" stroke="#243f33" stroke-width="1.5"/>
      <path d="M54 50V32l11-5v-6h36m-7-5 7 5-7 5" fill="none" stroke="#6c6874" stroke-width="3"/>
      <rect x="12" y="78" width="74" height="18" rx="2" fill="#a5b6ad" stroke="#243f33" stroke-width="2"/>
      <path d="M13 83h72" stroke="#243f33" stroke-width="1.5"/>
      <path d="M110 91V53m-5 7 5-7 5 7" fill="none" stroke="#566e60" stroke-width="3"/>
    </g>
    <text x="143" y="578" font-size="21" font-weight="700">4 · Exhaust</text>
    <text x="143" y="604" font-size="17">540–720° · piston returns</text>
    <text x="143" y="633" font-size="17">Exhaust open; gas leaves.</text>
    <text x="143" y="658" font-size="17">720° starts the next cycle.</text>

    <text x="210" y="705" text-anchor="middle" font-size="20" font-weight="700">720° crankshaft = 360° camshaft</text>
    <text x="210" y="733" text-anchor="middle" font-size="16">Valves switch at idealised stroke boundaries.</text>
    <text x="210" y="755" text-anchor="middle" font-size="16">Real valve events cross those boundaries.</text>
    <text x="210" y="780" text-anchor="middle" font-size="15">*Spark is schematic; actual ignition timing varies.</text>
  </g>
</svg>
