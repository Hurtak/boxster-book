<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 570" role="img" aria-labelledby="title desc">
<title id="title">The 2.9's four-stroke cycle</title><desc id="desc">Intake from zero to 180 degrees, compression from 180 to 360, power from 360 to 540, and exhaust from 540 to 720. The crankshaft turns twice and the camshaft once. Real valve events cross the idealised stroke boundaries.</desc>
<rect width="420" height="570" fill="#f5f3eb"/>
<g font-family="sans-serif" fill="#243f33">
<text x="210" y="34" text-anchor="middle" font-size="23" font-weight="700">Four strokes, two turns</text>
<text x="210" y="61" text-anchor="middle" font-size="18">2010 Boxster 2.9 · one cylinder</text>
<g stroke="#758c7d" stroke-width="3" fill="#e6ebe3"><path d="M32 91h74v68H32z M32 198h74v68H32z M32 305h74v68H32z M32 412h74v68H32z"/></g>
<g fill="#7f9f8a"><path d="M36 140h66v16H36z M36 204h66v16H36z M36 354h66v16H36z M36 418h66v16H36z"/></g>
<g fill="none" stroke-width="4"><path d="M69 109v20m-7-8 7 8 7-8" stroke="#306b95"/><path d="M69 249v-20m-7 8 7-8 7 8" stroke="#927039"/><path d="M69 323v20m-7-8 7 8 7-8" stroke="#b44c35"/><path d="M69 463v-20m-7 8 7-8 7 8" stroke="#6c6874"/></g>
<g font-size="20" font-weight="700"><text x="129" y="108">1 Intake · 0–180°</text><text x="129" y="215">2 Compression · 180–360°</text><text x="129" y="322">3 Power · 360–540°</text><text x="129" y="429">4 Exhaust · 540–720°</text></g>
<g font-size="18"><text x="129" y="138">Inlet open; charge enters.</text><text x="129" y="245">Both valves closed.</text><text x="129" y="352">Expanding gas pushes piston.</text><text x="129" y="459">Exhaust open; gas leaves.</text></g>
<text x="210" y="519" text-anchor="middle" font-size="18">720° crankshaft = 360° camshaft</text>
<text x="210" y="549" text-anchor="middle" font-size="18">Idealised valves · cylinders upright</text>
</g></svg>
