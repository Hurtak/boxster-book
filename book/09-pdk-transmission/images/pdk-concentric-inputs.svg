<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 820" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">PDK input shafts: two inputs share one centreline</title>
  <desc id="desc">An end view and a schematic longitudinal section show inner input shaft 1 passing through hollow outer input shaft 2. They can rotate at different speeds. Outer clutch pack K1 connects to inner shaft 1 for gears 1, 3, 5, 7 and reverse; inner clutch pack K2 connects to hollow shaft 2 for gears 2, 4 and 6. The packs are labelled, not drawn. Shaft lengths, diameters, clearances and bearings are not represented to scale.</desc>
  <rect width="600" height="820" fill="#fff"/>
  <text x="300" y="40" text-anchor="middle" font-size="29" fill="#243c32">Two inputs, one centreline</text>

  <!-- End view: the blue annulus is the wall of hollow input shaft 2. -->
  <circle cx="140" cy="188" r="104" fill="#dae8ed" stroke="#37748b" stroke-width="3"/>
  <circle cx="140" cy="188" r="68" fill="#fff" stroke="#37748b" stroke-width="3"/>
  <circle cx="140" cy="188" r="40" fill="#dcebe1" stroke="#176b53" stroke-width="4"/>
  <path d="M211 112H266" fill="none" stroke="#37748b" stroke-width="3"/>
  <path d="M173 211L236 250H266" fill="none" stroke="#176b53" stroke-width="3"/>
  <g font-size="28">
    <g fill="#37748b"><text x="282" y="113">Hollow shaft 2</text><text x="282" y="151">2 · 4 · 6</text></g>
    <g fill="#176b53"><text x="282" y="248">Inner shaft 1</text><text x="282" y="286">1 · 3 · 5 · 7 · R</text></g>
  </g>
  <text x="300" y="335" text-anchor="middle" font-size="27" fill="#243c32">End view: shaft 1 is inside shaft 2</text>

  <path d="M30 361H570" stroke="#d5dfd9" stroke-width="2"/>
  <text x="300" y="402" text-anchor="middle" font-size="28" fill="#243c32">Longitudinal section</text>
  <!-- A section through both walls of the tube and the inner shaft. -->
  <g fill="#dae8ed" stroke="#37748b" stroke-width="3">
    <rect x="90" y="434" width="370" height="38"/>
    <rect x="90" y="524" width="370" height="38"/>
  </g>
  <rect x="50" y="479" width="500" height="38" fill="#dcebe1" stroke="#176b53" stroke-width="3"/>
  <path d="M18 498H47M553 498H582" stroke="#84938b" stroke-width="2" stroke-dasharray="9 5"/>
  <g text-anchor="middle" font-size="27"><text x="275" y="462" fill="#37748b">Shaft 2</text><text x="300" y="508" fill="#176b53">Shaft 1</text></g>
  <g text-anchor="middle" fill="#243c32" font-size="27"><text x="300" y="609">The shafts can turn</text><text x="300" y="644">at different speeds.</text></g>
  <text x="300" y="680" text-anchor="middle" font-size="22" fill="#526159">Schematic section; bearings and dimensions omitted.</text>

  <g text-anchor="middle" font-size="28">
    <text x="300" y="739" fill="#176b53">Outer clutch K1 → inner shaft 1</text>
    <text x="300" y="786" fill="#37748b">Inner clutch K2 → hollow shaft 2</text>
  </g>
</svg>
