<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" role="img" aria-labelledby="t d"><title id="t">One roof motor drives two sides</title><desc id="d">A central electric motor sends rotation through two flexible shafts to left and right gearboxes. Levers and rods move the roof frame and compartment cover. This is a connection map, not a drawing of their physical positions.</desc><rect width="480" height="600" fill="#f3f5f0"/><g font-family="sans-serif" fill="#263c34" text-anchor="middle"><text x="240" y="38" font-size="25" font-weight="bold">One motor, two sides</text><text x="240" y="68" font-size="21">2010 2.9 · drive connections</text><g fill="#e2e9e1" stroke="#315d4d" stroke-width="2"><rect x="132" y="96" width="216" height="66" rx="6"/><rect x="28" y="251" width="192" height="70" rx="6"/><rect x="260" y="251" width="192" height="70" rx="6"/><rect x="28" y="407" width="192" height="80" rx="6"/><rect x="260" y="407" width="192" height="80" rx="6"/></g><g stroke="#315d4d" stroke-width="5" fill="none"><path d="M187 162 L124 185 M124 220 V249 m-7 -10 l7 10 l7 -10 M293 162 L356 185 M356 220 V249 m-7 -10 l7 10 l7 -10 M124 321 V339 M124 377 V405 m-7 -10 l7 10 l7 -10 M356 321 V339 M356 377 V405 m-7 -10 l7 10 l7 -10"/></g><g font-size="22"><text x="240" y="136">Electric motor</text><text x="124" y="211">Flexible shaft</text><text x="356" y="211">Flexible shaft</text><text x="124" y="294">Left gearbox</text><text x="356" y="294">Right gearbox</text><text x="124" y="366">Levers + rods</text><text x="356" y="366">Levers + rods</text><text x="124" y="439">Roof frame</text><text x="124" y="469">+ cover</text><text x="356" y="439">Roof frame</text><text x="356" y="469">+ cover</text></g><text x="240" y="532" font-size="21">Pivots constrain each part’s path.</text><text x="240" y="562" font-size="21">A connection map, not physical routing.</text></g></svg>
