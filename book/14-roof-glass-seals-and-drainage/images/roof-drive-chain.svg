<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 860" role="img" aria-labelledby="t d">
  <title id="t">One roof motor, two rotary drive paths</title>
  <desc id="d">One reversible electric motor turns two flexible rotary shafts inside their sleeves. Each shaft drives a side gearbox, whose output lever and jointed rods move the same roof frame and compartment cover. Curved arrows indicate rotation and lever sweep, not a cable being pulled along its length. Both sides must remain coordinated: unequal travel can twist the frame. Functional schematic only; positions, routing, linkage geometry and timing are not shown.</desc>
  <defs>
    <marker id="rotation" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#315d4d"/></marker>
    <marker id="sweep" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6 Z" fill="#a06a35"/></marker>
  </defs>
  <rect width="480" height="860" fill="#f3f5f0"/>
  <g font-family="sans-serif" fill="#263c34" text-anchor="middle">
    <text x="240" y="38" font-size="25" font-weight="bold">One motor, two sides</text>
    <text x="240" y="69" font-size="21">2010 2.9 · roof drive connections</text>

    <!-- Sleeves enclose rotating cores. No axial cable-pull arrows. -->
    <g fill="none" stroke-linecap="round">
      <path d="M170 166 C153 194 116 213 116 251 V324 M310 166 C327 194 364 213 364 251 V324" stroke="#cbd6cd" stroke-width="14"/>
      <path d="M170 166 C153 194 116 213 116 251 V324 M310 166 C327 194 364 213 364 251 V324" stroke="#315d4d" stroke-width="4" stroke-dasharray="8 6"/>
      <path d="M98 263 C88 248 143 248 141 263 C140 270 130 274 120 274" stroke="#315d4d" stroke-width="3" marker-start="url(#rotation)" marker-end="url(#rotation)"/>
      <path d="M346 263 C336 248 391 248 389 263 C388 270 378 274 368 274" stroke="#315d4d" stroke-width="3" marker-start="url(#rotation)" marker-end="url(#rotation)"/>
    </g>
    <rect x="134" y="96" width="212" height="70" rx="7" fill="#e2e9e1" stroke="#315d4d" stroke-width="2"/>
    <text x="240" y="125" font-size="23" font-weight="bold">1 electric motor</text>
    <text x="240" y="152" font-size="21">reversible rotation</text>
    <text x="240" y="212" font-size="22">2 flexible</text>
    <text x="240" y="241" font-size="22" font-weight="bold">rotary shafts</text>
    <text x="240" y="304" font-size="21">Spin inside sleeves</text>

    <g fill="#e2e9e1" stroke="#315d4d" stroke-width="2">
      <rect x="22" y="324" width="208" height="84" rx="7"/>
      <rect x="250" y="324" width="208" height="84" rx="7"/>
    </g>
    <text x="126" y="355" font-size="22" font-weight="bold">Left gearbox</text>
    <text x="354" y="355" font-size="22" font-weight="bold">Right gearbox</text>
    <g fill="none" stroke="#315d4d" stroke-width="2.5">
      <circle cx="113" cy="384" r="16"/><circle cx="139" cy="384" r="10"/>
      <circle cx="341" cy="384" r="10"/><circle cx="367" cy="384" r="16"/>
      <path d="M113 368 V400 M97 384 H129 M139 374 V394 M129 384 H149 M367 368 V400 M351 384 H383 M341 374 V394 M331 384 H351"/>
    </g>
    <text x="240" y="449" font-size="22">Levers + jointed rods</text>

    <!-- Symbolic output cranks and articulated rods, not linkage geometry. -->
    <g fill="none" stroke-linecap="round">
      <path d="M113 408 V490 M367 408 V490" stroke="#315d4d" stroke-width="4"/>
      <path d="M113 490 L148 521 M367 490 L332 521" stroke="#a06a35" stroke-width="10"/>
      <path d="M148 521 L113 610 M332 521 L367 610" stroke="#a06a35" stroke-width="5"/>
      <path d="M71 490 A42 42 0 0 0 113 532" stroke="#a06a35" stroke-width="3" marker-start="url(#sweep)" marker-end="url(#sweep)"/>
      <path d="M409 490 A42 42 0 0 1 367 532" stroke="#a06a35" stroke-width="3" marker-start="url(#sweep)" marker-end="url(#sweep)"/>
    </g>
    <g fill="#f3f5f0" stroke="#a06a35" stroke-width="3">
      <circle cx="113" cy="490" r="9"/><circle cx="367" cy="490" r="9"/>
      <circle cx="148" cy="521" r="6"/><circle cx="332" cy="521" r="6"/>
    </g>
    <text x="240" y="572" font-size="21">Lever sweep</text>
    <rect x="22" y="610" width="436" height="88" rx="7" fill="#e2e9e1" stroke="#315d4d" stroke-width="2"/>
    <g fill="#f3f5f0" stroke="#a06a35" stroke-width="3"><circle cx="113" cy="610" r="6"/><circle cx="367" cy="610" r="6"/></g>
    <text x="240" y="648" font-size="23" font-weight="bold">One roof frame</text>
    <text x="240" y="679" font-size="22">+ compartment cover</text>
    <text x="240" y="741" font-size="21">Both sides must stay coordinated.</text>
    <text x="240" y="772" font-size="21">Unequal travel can twist the frame.</text>
    <text x="240" y="815" font-size="19" fill="#526159">Functional schematic · no routing,</text>
    <text x="240" y="841" font-size="19" fill="#526159">linkage geometry or timing shown.</text>
  </g>
</svg>
