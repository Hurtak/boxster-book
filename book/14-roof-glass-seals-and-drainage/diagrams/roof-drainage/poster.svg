<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1210" role="img" aria-labelledby="t d">
  <title id="t">A shaped side pan gives water an escape route</title>
  <desc id="d">An ordinary powered-roof Boxster upper-body side crop, with the front pointing right, locates the side pan behind the seats, below the roof and cover joint. The enlarged part has an asymmetric scalloped rim, rising wing, mesh filter over a drain opening and a short drain pipe. Two enlarged sections compare discharge through a clear opening with debris beneath the filter and possible interior overflow. The seals, separate drain plates and compartment hoses have distinct jobs. Section depth, levels and spill point are illustrative, not capacity or concealed routing.</desc>
