<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 900" role="img" aria-labelledby="t d">
  <title id="t">Sealing and drainage do different jobs</title>
  <desc id="d">Two functional sections compare the same intact roof seal. Water on the wet side reaches a side drip pan. A clear opening and pipe let water leave the body; debris at the opening retains water, which can overflow towards the interior. Shapes, water levels and spill paths are illustrative, not measured capacities or hose routing.</desc>
  <rect width="480" height="900" fill="#f3f5f0"/>
  <g font-family="'Source Sans 3', sans-serif" fill="#263c34" font-size="22">
    <text x="24" y="37" font-size="27" font-weight="600">Give water an escape route</text>
    <text x="24" y="69">One side · functional section</text>
    <text x="24" y="112" font-size="24" font-weight="600">1  Clear outlet</text>
    <text x="74" y="151">Roof fabric</text>
    <text x="325" y="151">Intact seal</text>
    <path d="M44 210 L287 174 M314 174 H449" stroke="#315d4d" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="285" y="165" width="31" height="18" rx="8" fill="#b28049"/>
    <path d="M352 157 L305 162" stroke="#7f9890" stroke-width="2" fill="none"/>
    <path d="M227 173 L59 198 Q44 201 44 220 V234 M44 265 V295 m-6 -10 l6 10 l6 -10" stroke="#22779e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="71" y="255" fill="#22779e">Runoff reaches pan</text>
    <path d="M33 355 H302 V369 H33Z" fill="#7fb8d0" opacity=".7"/>
    <path d="M30 279 V372 H134 V428 M154 428 V372 H305 V279" stroke="#455b50" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="74" y="315" font-weight="600">Side drip pan</text>
    <text x="342" y="320" fill="#a14f39">Interior</text>
    <path d="M144 357 V439 m-7 -10 l7 10 l7 -10" stroke="#22779e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="181" y="408">Drain opening<tspan x="181" dy="27">and pipe</tspan></text>
    <text x="67" y="470">Outside body</text>
    <text x="24" y="526" font-size="24" font-weight="600">2  Blocked outlet</text>
    <text x="74" y="565">Roof fabric</text>
    <text x="325" y="565">Intact seal</text>
    <path d="M44 624 L287 588 M314 588 H449" stroke="#315d4d" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="285" y="579" width="31" height="18" rx="8" fill="#b28049"/>
    <path d="M352 571 L305 576" stroke="#7f9890" stroke-width="2" fill="none"/>
    <path d="M227 587 L59 612 Q44 615 44 634 V648 M44 679 V709 m-6 -10 l6 10 l6 -10" stroke="#22779e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="71" y="669" fill="#22779e">Runoff reaches pan</text>
    <path d="M33 693 H302 V783 H33Z" fill="#7fb8d0" opacity=".7"/>
    <path d="M30 693 V786 H134 V831 M154 831 V786 H305 V693" stroke="#455b50" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="74" y="729" font-weight="600">Side drip pan</text>
    <text x="65" y="759">Water at rim</text>
    <path d="M132 778 l24 17 m-24 0 l24 -17 M291 693 H314 Q332 693 332 712 V806 m-7 -10 l7 10 l7 -10" stroke="#a14f39" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="350" y="713" fill="#a14f39">Possible<tspan x="350" dy="27">overflow</tspan></text>
    <text x="350" y="795" fill="#a14f39">Interior</text>
    <text x="178" y="819">Debris blocks<tspan x="178" dy="27">the opening</tspan></text>
    <text x="24" y="886" font-size="21">Illustrative levels · no capacity or routing scale</text>
