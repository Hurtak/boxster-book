<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" role="img" aria-labelledby="t d"><title id="t">Sealing and drainage do different jobs</title><desc id="d">A clear drain lets water leave a drip pan. A blocked drain lets water build up and overflow even with the upper seal intact.</desc><rect width="480" height="620" fill="#f3f5f0"/><g font-family="sans-serif" fill="#263c34"><text x="24" y="38" font-size="25" font-weight="bold">Give water an escape route</text><text x="24" y="69" font-size="21">One side of the roof compartment</text><text x="24" y="105" font-size="22" font-weight="bold">Clear outlet</text><path d="M70 157 Q160 132 250 156" stroke="#315d4d" stroke-width="11" fill="none"/><rect x="252" y="150" width="60" height="14" rx="6" fill="#b28049"/><text x="323" y="162" font-size="21">Seal intact</text><path d="M80 184 V273 H330 V184 M160 273 V317" stroke="#455b50" stroke-width="5" fill="none"/><path d="M85 259 H325 V269 H85Z" fill="#7fb8d0"/><path d="M160 265 V312 m-7 -9 l7 9 l7 -9 M130 171 l-5 23 M190 171 l-5 23" stroke="#22779e" stroke-width="4" fill="none"/><text x="191" y="307" font-size="21">Water leaves the body</text><text x="24" y="369" font-size="22" font-weight="bold">Blocked outlet</text><path d="M70 421 Q160 396 250 420" stroke="#315d4d" stroke-width="11" fill="none"/><rect x="252" y="414" width="60" height="14" rx="6" fill="#b28049"/><text x="323" y="426" font-size="21">Seal intact</text><path d="M80 448 V537 H330 V448 M160 537 V576" stroke="#455b50" stroke-width="5" fill="none"/><path d="M85 455 H325 V533 H85Z" fill="#7fb8d0"/><path d="M150 546 l20 18 m-20 0 l20 -18 M319 457 h37 v85 m-7 -9 l7 9 l7 -9" stroke="#a14f39" stroke-width="5" fill="none"/><text x="95" y="491" font-size="21">Water accumulates</text><text x="180" y="569" font-size="21">Debris</text><text x="24" y="604" font-size="21">Concept only · no measured water capacity</text></g></svg>
