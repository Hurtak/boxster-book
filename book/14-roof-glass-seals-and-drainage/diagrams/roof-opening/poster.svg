<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1130" role="img" aria-labelledby="t d">
<title id="t">How the ordinary Boxster roof folds behind the seats</title>
<desc id="d">A functional side cutaway of the MY2010 Boxster 2.9 roof. The front header is released manually. The powered frame and compartment cover move in overlapping stages. The heated rear glass stays rigid while the fabric and articulated frame fold into a well behind the seats. The cover closes above the stowed roof. Pale bodywork is a fixed reference and cut away over the well. Intermediate geometry is illustrative.</desc>
