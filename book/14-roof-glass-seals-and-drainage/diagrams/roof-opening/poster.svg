<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" role="img" aria-labelledby="t d"><title id="t">The ordinary roof folds behind the seats</title><desc id="d">Four schematic stages show the closed roof, a raised compartment cover, the folded frame and the stowed roof with its cover closed.</desc><rect width="480" height="760" fill="#f3f5f0"/><g font-family="sans-serif" fill="#263c34"><text x="24" y="37" font-size="25" font-weight="bold">Where the roof goes</text><text x="24" y="65" font-size="21">2010 Boxster 2.9 · schematic stages</text><g stroke="#315d4d" stroke-linecap="round" stroke-linejoin="round" fill="none"><g transform="translate(0 70)"><path d="M45 169 Q55 145 130 145 L174 154 H430" stroke-width="4"/><path d="M130 145 L184 90" stroke="#718c91" stroke-width="6"/><path d="M184 90 Q250 42 312 84 L368 144" stroke-width="9"/><path d="M335 143 L425 146" stroke-width="7"/></g><g transform="translate(0 230)"><path d="M45 169 Q55 145 130 145 L174 154 H430" stroke-width="4"/><path d="M130 145 L184 90" stroke="#718c91" stroke-width="6"/><path d="M216 66 Q285 39 321 95 L366 144" stroke-width="9"/><path d="M365 143 L410 62" stroke-width="7"/></g><g transform="translate(0 390)"><path d="M45 169 Q55 145 130 145 L174 154 H430" stroke-width="4"/><path d="M130 145 L184 90" stroke="#718c91" stroke-width="6"/><path d="M327 82 L303 47 L375 70 L339 111 L371 143" stroke-width="9"/><path d="M365 143 L410 62" stroke-width="7"/></g><g transform="translate(0 550)"><path d="M45 169 Q55 145 130 145 L174 154 H430" stroke-width="4"/><path d="M130 145 L184 90" stroke="#718c91" stroke-width="6"/><path d="M339 157 l15 -7 l21 8 l16 -6 l17 6" stroke-width="7"/><path d="M335 143 L425 146" stroke-width="7"/></g></g><g font-size="21"><text x="24" y="111">1  Closed and latched</text><text x="24" y="271">2  Cover gives clearance</text><text x="24" y="431">3  Frame folds rearwards</text><text x="24" y="591">4  Roof stowed; cover closed</text></g></g></svg>
