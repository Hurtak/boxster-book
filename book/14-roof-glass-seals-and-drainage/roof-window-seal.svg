<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 590" role="img" aria-labelledby="t d"><title id="t">Why frameless glass drops before the door opens</title><desc id="d">With the door closed the glass meets the roof seal. A small downward movement gives the glass clearance to move outwards with the door. The cable regulator inside the door provides the movement.</desc><rect width="480" height="590" fill="#f3f5f0"/><g font-family="sans-serif" fill="#263c34"><text x="24" y="38" font-size="25" font-weight="bold">A small drop gives clearance</text><text x="24" y="68" font-size="21">2010 2.9 · conceptual end section</text><g stroke-linecap="round" stroke-linejoin="round"><path d="M70 127 H275" stroke="#315d4d" stroke-width="19"/><path d="M180 140 h52 v32 h-19" stroke="#b28049" stroke-width="13" fill="none"/><path d="M209 160 V294" stroke="#78a7b8" stroke-width="10"/><path d="M115 290 H258 V321 H115Z" fill="#dce5dc" stroke="#315d4d" stroke-width="3"/><path d="M70 384 H275" stroke="#315d4d" stroke-width="19"/><path d="M180 397 h52 v32 h-19" stroke="#b28049" stroke-width="13" fill="none"/><path d="M209 460 V550" stroke="#78a7b8" stroke-width="10"/><path d="M228 449 h54 m-9 -7 l9 7 l-9 7" stroke="#315d4d" stroke-width="4" fill="none"/></g><g font-size="21"><text x="24" y="103" font-weight="bold">Door closed</text><text x="285" y="134">Roof edge</text><text x="285" y="181">Resilient seal</text><text x="285" y="237">Glass raised</text><text x="24" y="360" font-weight="bold">Before opening</text><text x="285" y="423">Clearance</text><text x="285" y="484">Glass lowered</text></g><text x="24" y="578" font-size="21">Drop exaggerated · no adjustment dimensions</text></g></svg>
