<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="fluid-exhaust-title fluid-exhaust-desc"><title id="fluid-exhaust-title">Two exhaust banks meet near the outlet</title><desc id="fluid-exhaust-desc">Each bank has a manifold, a control oxygen sensor before the first catalyst, a monitoring oxygen sensor after it, a second catalyst and a silencer. Connecting pipes mix gases from both banks before the central outlet.</desc><defs><marker id="fluid-exhaust-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#79735e"/></marker></defs><rect width="600" height="520" fill="#f7f7f2"/><g font-family="sans-serif" fill="#24342c" text-anchor="middle"><text x="300" y="34" font-size="25" font-weight="700">Treat, silence, then discharge</text><text x="153" y="72" font-size="23">Bank 1–3</text><text x="447" y="72" font-size="23">Bank 4–6</text><g fill="none" stroke="#79735e" stroke-width="8" marker-end="url(#fluid-exhaust-arrow)"><path d="M153 92V391"/><path d="M447 92V391"/><path d="M153 414V451H300V478"/><path d="M447 414V451H300"/></g><g fill="#e6e6db" stroke="#79735e" stroke-width="2"><rect x="71" y="91" width="164" height="42" rx="6"/><rect x="365" y="91" width="164" height="42" rx="6"/><rect x="71" y="172" width="164" height="46" rx="6"/><rect x="365" y="172" width="164" height="46" rx="6"/><rect x="71" y="297" width="164" height="46" rx="6"/><rect x="365" y="297" width="164" height="46" rx="6"/><rect x="71" y="376" width="164" height="47" rx="6"/><rect x="365" y="376" width="164" height="47" rx="6"/></g><g font-size="22"><text x="153" y="119">Manifold</text><text x="447" y="119">Manifold</text><text x="153" y="202">Catalyst 1</text><text x="447" y="202">Catalyst 1</text><text x="153" y="328">Catalyst 2</text><text x="447" y="328">Catalyst 2</text><text x="153" y="407">Silencer</text><text x="447" y="407">Silencer</text></g><g fill="#236148"><circle cx="153" cy="150" r="10"/><circle cx="447" cy="150" r="10"/><circle cx="153" cy="256" r="10"/><circle cx="447" cy="256" r="10"/></g><g font-size="20"><text x="300" y="155">λ control</text><text x="300" y="261">λ monitor</text><text x="300" y="436">Connecting pipes</text><text x="300" y="503">Central outlet</text></g><g stroke="#236148" stroke-width="2"><path d="M168 150H237M363 150H432M168 256H229M371 256H432"/></g></g></svg>
