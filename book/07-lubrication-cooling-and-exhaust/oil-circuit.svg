<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" role="img" aria-labelledby="fluid-oil-title fluid-oil-desc">
<title id="fluid-oil-title">Five pumps, two different jobs</title><desc id="fluid-oil-desc">Four scavenge pumps return oil from two points in each head to a reservoir inside the engine. A fifth pressure pump supplies the engine lubrication circuit, including filtration and heat exchange.</desc>
<defs><marker id="fluid-oil-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#236148"/></marker><marker id="fluid-oil-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#ad6924"/></marker></defs>
<rect width="600" height="470" fill="#f7f7f2"/>
<g font-family="sans-serif" fill="#24342c" text-anchor="middle"><text x="300" y="34" font-size="25" font-weight="700">Five pumps, two jobs</text><rect x="20" y="66" width="560" height="335" rx="18" fill="#eef1ea" stroke="#9ca99e" stroke-width="2"/><text x="300" y="95" font-size="20">All within the engine assembly</text>
<path d="M300 294V140M300 159H140M300 159H460" fill="none" stroke="#236148" stroke-width="7" marker-end="url(#fluid-oil-green)"/>
<rect x="210" y="112" width="180" height="63" rx="8" fill="#e0ebdf" stroke="#236148" stroke-width="2"/><text x="300" y="138" font-size="21">Bearings</text><text x="300" y="162" font-size="21">and valve gear</text>
<rect x="42" y="127" width="140" height="74" rx="8" fill="#fff" stroke="#7b8b7b" stroke-width="2"/><rect x="418" y="127" width="140" height="74" rx="8" fill="#fff" stroke="#7b8b7b" stroke-width="2"/><text x="112" y="156" font-size="22">Head 1–3</text><text x="488" y="156" font-size="22">Head 4–6</text><text x="112" y="184" font-size="20">2 return points</text><text x="488" y="184" font-size="20">2 return points</text>
<g fill="none" stroke="#ad6924" stroke-width="6"><path d="M112 202V323H191" marker-end="url(#fluid-oil-amber)"/><path d="M488 202V323H409" marker-end="url(#fluid-oil-amber)"/></g>
<g fill="#f2ddb9" stroke="#ad6924" stroke-width="2"><circle cx="91" cy="239" r="19"/><circle cx="132" cy="239" r="19"/><circle cx="468" cy="239" r="19"/><circle cx="509" cy="239" r="19"/></g><text x="112" y="281" font-size="20">2 scavenge pumps</text><text x="488" y="281" font-size="20">2 scavenge pumps</text>
<rect x="194" y="294" width="212" height="61" rx="9" fill="#f2ddb9" stroke="#ad6924" stroke-width="2"/><text x="300" y="320" font-size="22">Internal reservoir</text><text x="300" y="345" font-size="20">Oil collected in sump</text>
<rect x="226" y="204" width="148" height="60" rx="8" fill="#e0ebdf" stroke="#236148" stroke-width="2"/><text x="300" y="229" font-size="21">Pressure pump</text><text x="300" y="253" font-size="20">Demand controlled</text><text x="300" y="383" font-size="20">Pressure circuit includes filter and oil cooler</text>
<text x="300" y="434" font-size="20">Amber: return oil · Green: supplied oil</text><text x="300" y="460" font-size="18">Functional grouping, not exact passage routing</text></g></svg>
