<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="fluid-heat-title fluid-heat-desc"><title id="fluid-heat-title">Oil and coolant exchange heat, not fluid</title><desc id="fluid-heat-desc">Separate oil and coolant channels share metal walls. Heat passes from the hotter fluid to the cooler fluid; the liquids stay separate.</desc><defs><marker id="fluid-heat-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8d5933"/></marker></defs><rect width="600" height="380" fill="#f7f7f2"/><g font-family="sans-serif" fill="#24342c" text-anchor="middle"><text x="300" y="36" font-size="25" font-weight="700">Heat crosses a metal wall</text><rect x="65" y="77" width="470" height="205" rx="12" fill="#dce0d8" stroke="#788878" stroke-width="2"/><rect x="80" y="92" width="440" height="63" rx="5" fill="#f2ddb9"/><rect x="80" y="204" width="440" height="63" rx="5" fill="#d5e8ef"/><text x="300" y="132" font-size="25">Engine oil</text><text x="300" y="245" font-size="25">Engine coolant</text><text x="150" y="187" font-size="20">Metal</text><g fill="none" stroke="#8d5933" stroke-width="4" marker-end="url(#fluid-heat-arrow)"><path d="M267 150V206"/><path d="M330 150V206"/><path d="M393 150V206"/></g><text x="300" y="320" font-size="22">Heat flows from hotter to cooler</text><text x="300" y="351" font-size="20">Oil and coolant remain in separate channels</text><text x="300" y="376" font-size="17">Conceptual section; arrows show oil hotter than coolant</text></g></svg>
