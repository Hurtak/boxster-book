      <path d="M16 270H171V294"/><path d="M171 356V392"/>
      <path d="M171 448V484"/><path d="M79 515H26"/>
    </g>
    <path d="M171 363H283V606H261" stroke="#7c897c" stroke-width="2"/>
  </g>
