    <path d="M123 36V60"/><path d="M171 36V60"/><path d="M219 36V60"/>
    <path d="M123 148V176"/><path d="M171 148V176"/><path d="M219 148V176"/>
  </g>
  <rect x="83" y="70" width="176" height="68" rx="8" fill="#edf0e9" stroke="#aab1aa" stroke-width="2"/>
  <rect x="83" y="294" width="176" height="62" rx="8" fill="#f2ddb9" stroke="#526455" stroke-width="2"/>
  <rect x="83" y="392" width="176" height="56" rx="8" fill="#e0ebdf" stroke="#236148" stroke-width="2"/>
  <rect x="83" y="484" width="176" height="62" rx="8" fill="#e0ebdf" stroke="#236148" stroke-width="2"/>
  <rect x="81" y="572" width="180" height="66" rx="8" fill="#eef1ea" stroke="#7c897c" stroke-width="2"/>
  <g font-family="'Source Sans 3',sans-serif" fill="#24342c" text-anchor="middle">
    <text x="171" y="23" font-size="16" font-weight="600">FRONT · WARM-UP EXAMPLE</text>
    <text x="171" y="96" font-size="20" font-weight="600">Front radiator</text>
    <text x="171" y="126" font-size="20">pair</text>
    <text x="171" y="199" font-size="17" font-weight="600">Airflow depends on conditions</text>
    <text x="171" y="222" font-size="16">Fans: not requested in this example</text>
    <text x="171" y="254" font-size="18" font-weight="600">Short bypass</text>
    <text x="171" y="320" font-size="20" font-weight="600">Thermostat</text>
    <text x="171" y="343" font-size="16">Radiator restricted</text>
    <text x="171" y="414" font-size="20" font-weight="600">Coolant pump</text>
    <text x="171" y="441" font-size="17">Belt driven</text>
    <text x="171" y="508" font-size="20" font-weight="600">Engine jackets</text>
    <text x="171" y="535" font-size="17">Heat enters coolant</text>
    <text x="171" y="598" font-size="20" font-weight="600">Expansion tank</text>
    <text x="171" y="622" font-size="16">Expansion + fill / level</text>
    <text x="171" y="658" font-size="16" font-weight="600">REAR / ENGINE AREA</text>
    <text x="171" y="686" font-size="15">Functional schematic; branches omitted</text>
    <text x="171" y="708" font-size="15">Solid: coolant · green dashes: air</text>
