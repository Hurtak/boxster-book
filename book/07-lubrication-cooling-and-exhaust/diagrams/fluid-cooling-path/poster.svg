<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="fluid-cooling-poster-title fluid-cooling-poster-desc"><title id="fluid-cooling-poster-title">Coolant circulation during warm-up</title><desc id="fluid-cooling-poster-desc">The pump circulates coolant through the engine's short bypass while the thermostat restricts the long route through the front radiator pair. An expansion tank connects to the coolant system. Fan airflow and coolant circulation are separate functions.</desc><defs><marker id="fluid-cooling-poster-warm" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#b35e37"/></marker><marker id="fluid-cooling-poster-cool" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#26708a"/></marker></defs><rect width="600" height="440" fill="#f7f7f2"/><g font-family="sans-serif" fill="#24342c" text-anchor="middle"><text x="300" y="28" font-size="25" font-weight="700">Warm-up: keep the short circuit moving</text><path d="M217 364H70V95H204M396 95H530V300" fill="none" stroke="#aab1aa" stroke-width="5" stroke-dasharray="7 5"/><path d="M217 364H110V300H525" fill="none" stroke="#b35e37" stroke-width="6" marker-end="url(#fluid-cooling-poster-warm)"/><path d="M530 312V364H388" fill="none" stroke="#26708a" stroke-width="6" marker-end="url(#fluid-cooling-poster-cool)"/><rect x="204" y="59" width="192" height="70" rx="8" fill="#edf0e9" stroke="#aab1aa" stroke-width="2"/><text x="300" y="87" font-size="22">Front radiator</text><text x="300" y="114" font-size="22">pair</text><text x="300" y="160" font-size="20">Fans: not requested</text><rect x="209" y="194" width="182" height="52" rx="8" fill="#eef1ea" stroke="#7c897c" stroke-width="2"/><text x="300" y="227" font-size="22">Expansion tank</text><path d="M300 246V334" stroke="#7c897c" stroke-width="3" stroke-dasharray="7 5"/><text x="300" y="282" font-size="21">Short bypass</text><circle cx="530" cy="300" r="14" fill="#f2ddb9" stroke="#526455" stroke-width="2"/><text x="300" y="326" font-size="21">Thermostat restricts radiator route</text><rect x="217" y="340" width="166" height="61" rx="8" fill="#e0ebdf" stroke="#236148" stroke-width="2"/><text x="300" y="365" font-size="22">Engine + pump</text><text x="300" y="391" font-size="20">Rear of car</text><text x="300" y="429" font-size="18">Functional schematic; auxiliary branches omitted</text></g></svg>
