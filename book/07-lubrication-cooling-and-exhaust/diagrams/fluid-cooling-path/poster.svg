<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 720" role="img" aria-labelledby="fluid-cooling-poster-title fluid-cooling-poster-desc" style="max-width:430px;margin-inline:auto">
  <title id="fluid-cooling-poster-title">Coolant circuit: warm-up example</title>
  <desc id="fluid-cooling-poster-desc">The belt-driven pump circulates coolant through the engine jackets and short bypass while the thermostat restricts the long route to the front radiator pair. Orange return coolant has not passed through the radiators. Dashed green arrows show air, separate from liquid circulation; fans are not requested in this example. The expansion tank is a side connection that accommodates volume changes and provides a rear filling and level-checking point. Functional schematic, not actual pipe geometry: the radiator pair is grouped, tank plumbing is simplified and auxiliary branches are omitted. Thermostat opening is progressive.</desc>
  <defs>
    <marker id="fluid-cooling-poster-warm" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#b35e37"/></marker>
    <marker id="fluid-cooling-poster-air" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1L5 3.5L1 6" fill="none" stroke="#52715a" stroke-width="1.5"/></marker>
  </defs>
