<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1035" role="img" aria-labelledby="fluid-oil-title fluid-oil-desc">
  <title id="fluid-oil-title">Five pump sections in one oil-pan assembly</title>
  <desc id="fluid-oil-desc">Functional oil circuit for the 2010 Boxster 2.9. Two extraction points in each cylinder head connect to four scavenge sections, all integrated with one demand-controlled pressure section in a common pump housing in the oil-pan area. Scavenged oil and other engine drain oil return to the reservoir inside the engine. The pressure section draws from this reservoir and feeds the lubrication circuit, which includes the oil filter and oil-to-coolant heat exchanger. All five sections share a shaft driven by the crankshaft through a chain. DME control changes pressure-section delivery hydraulically; it does not provide the mechanical drive. Symbols show functions rather than pump geometry or the order of galleries, filter and exchanger.</desc>
  <defs>
    <marker id="fluid-oil-green" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#236148"/></marker>
    <marker id="fluid-oil-amber" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#ad6924"/></marker>
  </defs>
  <rect width="400" height="1035" fill="#f7f7f2"/>
  <g font-family="sans-serif" fill="#24342c" text-anchor="middle">
    <text x="200" y="35" font-size="25" font-weight="700">Five sections, two oil jobs</text>

    <!-- Supply and return are functional paths, not cast-gallery routing. -->
    <path d="M325 530H373V111H345" fill="none" stroke="#236148" stroke-width="5" marker-end="url(#fluid-oil-green)"/>
    <text x="391" y="320" transform="rotate(-90 391 320)" font-size="18" fill="#236148">Pressure supply</text>
    <path d="M55 111H25V708H85" fill="none" stroke="#ad6924" stroke-width="4" marker-end="url(#fluid-oil-amber)"/>
    <text x="19" y="485" transform="rotate(-90 19 485)" font-size="18" fill="#ad6924">Other engine drain oil</text>
    <rect x="55" y="75" width="290" height="72" rx="9" fill="#e0ebdf" stroke="#236148" stroke-width="2"/>
    <text x="200" y="106" font-size="22" font-weight="700">Bearings + valve gear</text>
    <text x="200" y="133" font-size="18">Pressure-fed lubrication</text>
    <g fill="none" stroke="#ad6924" stroke-width="4" marker-end="url(#fluid-oil-amber)">
      <path d="M117 147V185"/>
      <path d="M278 147V185"/>
    </g>

    <g fill="#fff" stroke="#7b8b7b" stroke-width="2">
      <rect x="55" y="185" width="125" height="80" rx="8"/>
      <rect x="215" y="185" width="125" height="80" rx="8"/>
    </g>
    <g font-size="20" font-weight="700"><text x="117" y="213">Head 1–3</text><text x="278" y="213">Head 4–6</text></g>
    <g font-size="18"><text x="117" y="237">2 extraction</text><text x="117" y="258">points</text><text x="278" y="237">2 extraction</text><text x="278" y="258">points</text></g>

    <!-- The enclosing housing prevents reading these as head-mounted pumps. -->
    <rect x="45" y="310" width="310" height="305" rx="16" fill="#eef1ea" stroke="#7b8b7b" stroke-width="2"/>
    <g fill="none" stroke="#ad6924" stroke-width="4" marker-end="url(#fluid-oil-amber)">
      <path d="M87 265V329"/><path d="M152 265V329"/>
      <path d="M247 265V329"/><path d="M312 265V329"/>
    </g>
    <g fill="#ad6924"><circle cx="87" cy="265" r="4"/><circle cx="152" cy="265" r="4"/><circle cx="247" cy="265" r="4"/><circle cx="312" cy="265" r="4"/></g>
    <g fill="#f2ddb9" stroke="#ad6924" stroke-width="2">
      <circle cx="87" cy="350" r="21"/><circle cx="152" cy="350" r="21"/><circle cx="247" cy="350" r="21"/><circle cx="312" cy="350" r="21"/>
    </g>
    <g fill="#ad6924"><path d="M78 344H96L87 359Z"/><path d="M143 344H161L152 359Z"/><path d="M238 344H256L247 359Z"/><path d="M303 344H321L312 359Z"/></g>
    <g fill="none" stroke="#ad6924" stroke-width="4">
      <path d="M87 371V405H312V371M152 371V405M247 371V405"/>
      <path d="M87 405H65V643H145V665" marker-end="url(#fluid-oil-amber)"/>
    </g>
    <text x="210" y="447" font-size="21" font-weight="700">4 scavenge sections</text>

    <rect x="150" y="485" width="175" height="90" rx="9" fill="#e0ebdf" stroke="#236148" stroke-width="2"/>
    <text x="238" y="514" font-size="21" font-weight="700">1 pressure</text>
    <text x="238" y="539" font-size="21" font-weight="700">section</text>
    <text x="238" y="564" font-size="18">Demand controlled</text>
    <text x="200" y="474" font-size="18">One housing · oil-pan area</text>

    <path d="M238 665V615" fill="none" stroke="#236148" stroke-width="5"/>
    <path d="M238 615V575" fill="none" stroke="#236148" stroke-width="5" marker-end="url(#fluid-oil-green)"/>
    <text x="284" y="640" font-size="18" fill="#236148">Intake</text>
    <rect x="85" y="665" width="240" height="85" rx="10" fill="#f2ddb9" stroke="#ad6924" stroke-width="2"/>
    <text x="205" y="697" font-size="21" font-weight="700">Integrated reservoir</text>
    <text x="205" y="725" font-size="18">Inside engine / oil sump</text>

    <text x="200" y="793" font-size="21" font-weight="700">All five share mechanical drive</text>
    <text x="200" y="822" font-size="17">Crankshaft → oil-pump chain → shaft</text>
    <text x="200" y="865" font-size="21" font-weight="700">Pressure-section regulation</text>
    <text x="200" y="894" font-size="18">DME → valve → hydraulic gear shift</text>
    <text x="200" y="919" font-size="18">Changes overlap and pump delivery.</text>
    <text x="200" y="958" font-size="18">Pressure circuit includes oil filter</text>
    <text x="200" y="983" font-size="18">and oil-to-coolant exchanger.</text>
    <text x="200" y="1020" font-size="16" fill="#526159">Functional paths; geometry and gallery order omitted.</text>
  </g>
</svg>
