<svg xmlns="http://www.w3.org/2000/svg" width="800" height="715" viewBox="0 0 800 715" role="img" aria-labelledby="title desc">
<title id="title">Pressure-pump gear overlap — more overlap</title>
<desc id="desc">The chain-driven fixed gear meshes with a second, axially sliding gear. A control piston, spring piston and spring move with the lower gear. A DME-controlled hydraulic valve changes the pressure on the spring-piston side. The active tooth width is greater while both gears remain driven. Outer assembly proportions are checked against part photographs; this enlarged internal section follows the factory principle drawing and is not dimensional CAD.</desc>
