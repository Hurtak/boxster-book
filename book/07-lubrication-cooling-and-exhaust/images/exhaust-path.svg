<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1072" role="img" aria-labelledby="fluid-exhaust-title fluid-exhaust-desc">
  <title id="fluid-exhaust-title">Two exhaust banks, two converter assemblies, one central outlet</title>
  <desc id="fluid-exhaust-desc">Functional schematic of the standard MY2010 Boxster 2.9 exhaust, not physical pipe geometry. Each cylinder bank has a manifold with one integrated main catalytic converter containing two ceramic substrate bricks. Hot exhaust gas passes the LSU oxygen sensor before brick 1, the LSF monitoring sensor between bricks 1 and 2, then the main silencer. Two connecting pipes mix the banks before discharge through the single shaped central outlet. The four green sensor boxes indicate measurement points, not separate gas-treatment devices. Catalysts convert pollutants; silencers attenuate sound.</desc>
  <defs>
    <marker id="fluid-exhaust-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#79735e"/></marker>
  </defs>
  <rect width="420" height="1072" fill="#f7f7f2"/>
  <g font-family="sans-serif" fill="#24342c" text-anchor="middle">
    <text x="210" y="34" font-size="23" font-weight="700">Two banks, one central outlet</text>
    <text x="210" y="62" font-size="18">MY2010 Boxster 2.9 · standard exhaust</text>
    <text x="210" y="96" font-size="19">Functional sequence · gas flows ↓</text>
    <g font-size="22" font-weight="700"><text x="110" y="137">Bank 1–3</text><text x="310" y="137">Bank 4–6</text></g>

    <!-- One manifold/converter assembly per bank; two substrate bricks inside each. -->
    <g fill="#eeeee5" stroke="#79735e" stroke-width="2">
      <rect x="20" y="158" width="180" height="432" rx="12"/>
      <rect x="220" y="158" width="180" height="432" rx="12"/>
    </g>
    <g font-size="20" font-weight="700">
      <text x="110" y="187">Manifold +</text><text x="110" y="213">one converter</text>
      <text x="310" y="187">Manifold +</text><text x="310" y="213">one converter</text>
    </g>
    <g fill="none" stroke="#79735e" stroke-width="5" marker-end="url(#fluid-exhaust-arrow)">
      <path d="M110 220V238"/><path d="M310 220V238"/>
      <path d="M110 301V326"/><path d="M310 301V326"/>
      <path d="M110 379V410"/><path d="M310 379V410"/>
      <path d="M110 473V504"/><path d="M310 473V504"/>
      <path d="M110 557V627"/><path d="M310 557V627"/>
    </g>
    <g fill="#e0ece4" stroke="#236148" stroke-width="2">
      <rect x="38" y="241" width="144" height="58" rx="8"/>
      <rect x="238" y="241" width="144" height="58" rx="8"/>
      <rect x="38" y="413" width="144" height="58" rx="8"/>
      <rect x="238" y="413" width="144" height="58" rx="8"/>
    </g>
    <g fill="#236148">
      <g font-size="20" font-weight="700"><text x="110" y="265">LSU · control</text><text x="310" y="265">LSU · control</text><text x="110" y="437">LSF · monitor</text><text x="310" y="437">LSF · monitor</text></g>
      <g font-size="18"><text x="110" y="289">before brick 1</text><text x="310" y="289">before brick 1</text><text x="110" y="461">between bricks</text><text x="310" y="461">between bricks</text></g>
    </g>
    <g fill="#e5dcc8" stroke="#79735e" stroke-width="2">
      <rect x="38" y="329" width="144" height="48" rx="5"/>
      <rect x="238" y="329" width="144" height="48" rx="5"/>
      <rect x="38" y="507" width="144" height="48" rx="5"/>
      <rect x="238" y="507" width="144" height="48" rx="5"/>
    </g>
    <g font-size="22"><text x="110" y="360">Brick 1</text><text x="310" y="360">Brick 1</text><text x="110" y="538">Brick 2</text><text x="310" y="538">Brick 2</text></g>

    <g fill="#e6e6db" stroke="#79735e" stroke-width="2">
      <rect x="20" y="630" width="180" height="70" rx="9"/>
      <rect x="220" y="630" width="180" height="70" rx="9"/>
      <rect x="38" y="749" width="344" height="74" rx="10"/>
      <path d="M112 872H308Q324 872 328 887L334 919Q337 934 321 934H99Q83 934 86 919L92 887Q96 872 112 872Z"/>
    </g>
    <g font-size="21" font-weight="700"><text x="110" y="660">Main silencer</text><text x="310" y="660">Main silencer</text><text x="210" y="780">Two connecting pipes</text></g>
    <g font-size="18"><text x="110" y="686">reduces sound</text><text x="310" y="686">reduces sound</text></g>
    <text x="210" y="808" font-size="20">mix both banks</text>
    <g fill="none" stroke="#79735e" stroke-width="5" marker-end="url(#fluid-exhaust-arrow)">
      <path d="M110 702V746"/><path d="M310 702V746"/>
      <path d="M210 825V869"/>
    </g>
    <text x="210" y="898" font-size="21" font-weight="700">Single central outlet</text>
    <text x="210" y="923" font-size="18">at the centre of the rear</text>

    <g font-size="19"><text x="210" y="973">Two converters · four ceramic bricks</text><text x="210" y="1001">Four λ sensors · one pair per bank</text></g>
    <text x="210" y="1040" font-size="18" fill="#526159">Bricks convert pollutants; silencers reduce noise.</text>
  </g>
</svg>
