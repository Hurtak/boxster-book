<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">The standard CDR-30 radio signal path</title>
  <desc id="desc">FM radio passes through the CDR-30 tuner and head-unit output stages to two door woofers and two dashboard tweeters. External AUX needs the optional interface; USB and iPod control need PCM with its interface in the UK 2010 specification. The sound package is a separate choice.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#176b53"/></marker></defs>
  <rect width="600" height="420" fill="#f4f3ec"/>
  <text x="25" y="35" font-size="24" fill="#203e33" font-weight="bold">FM radio · CDR-30 · standard sound</text>
  <g fill="#fff" stroke="#72887b" stroke-width="2"><rect x="90" y="59" width="420" height="57" rx="5"/><rect x="90" y="144" width="420" height="57" rx="5"/><rect x="90" y="229" width="420" height="57" rx="5"/><rect x="90" y="314" width="420" height="67" rx="5"/></g>
  <g fill="#203e33" font-size="22" text-anchor="middle"><text x="300" y="95">FM broadcast → tuner</text><text x="300" y="180">CDR-30 selects the programme</text><text x="300" y="265">Head-unit output stages</text><text x="300" y="343">2 dashboard tweeters</text><text x="300" y="369">+ 2 door woofers</text></g>
  <g stroke="#176b53" stroke-width="4" marker-end="url(#arr)"><path d="M300 116V138"/><path d="M300 201V223"/><path d="M300 286V308"/></g>
  <text x="25" y="409" font-size="19" fill="#53675d">Source interfaces and sound upgrades are separate choices.</text>
</svg>
