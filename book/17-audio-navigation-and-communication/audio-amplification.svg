<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">From a music source to moving air</title>
  <desc id="desc">The source feeds the head unit, the amplifier uses electrical power to drive a coil, and the coil moves the speaker cone. Signal and electrical supply have different roles.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#176b53"/></marker></defs>
  <rect width="600" height="420" fill="#f4f3ec"/>
  <text x="30" y="36" fill="#203e33" font-size="24" font-weight="bold">Two jobs: information and power</text>
  <g fill="#fff" stroke="#72887b" stroke-width="2">
    <rect x="25" y="67" width="160" height="74" rx="5"/>
    <rect x="220" y="67" width="160" height="74" rx="5"/>
    <rect x="415" y="67" width="160" height="74" rx="5"/>
    <rect x="220" y="206" width="160" height="69" rx="5"/>
  </g>
  <g font-size="21" fill="#203e33" text-anchor="middle">
    <text x="105" y="98">Source<tspan x="105" dy="27">programme</tspan></text>
    <text x="300" y="98">Head unit<tspan x="300" dy="27">select / adjust</tspan></text>
    <text x="495" y="98">Amplifier<tspan x="495" dy="27">drive current</tspan></text>
    <text x="300" y="233">Electrical<tspan x="300" dy="27">supply</tspan></text>
  </g>
  <g fill="none" stroke="#176b53" stroke-width="4" marker-end="url(#arrow)">
    <path d="M185 104H214"/><path d="M380 104H409"/>
    <path d="M380 240H495V148"/><path d="M495 141V288H303V298"/>
  </g>
  <text x="415" y="195" font-size="20" fill="#176b53">power</text>
  <g transform="translate(285 304)" stroke="#203e33" stroke-width="3" fill="#e2e9e0">
    <rect x="0" y="0" width="36" height="50"/>
    <path d="M36 12 92-15V65L36 38Z"/>
    <path d="M104 2Q127 25 104 48M120-10Q154 25 120 60" fill="none" stroke="#176b53"/>
  </g>
  <text x="40" y="321" font-size="22" fill="#203e33">Coil + cone</text>
  <text x="40" y="349" font-size="20" fill="#203e33">current → motion</text>
  <text x="30" y="395" font-size="20" fill="#53675d">More drivers can share the same programme channel.</text>
</svg>
