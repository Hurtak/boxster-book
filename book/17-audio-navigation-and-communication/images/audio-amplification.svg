<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1170" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">From programme information to moving air</title>
  <desc id="desc">Dashed arrows carry programme information from the source through the head unit to the amplifier. A separate orange arrow supplies DC energy from the vehicle battery and charging system. The amplifier uses that energy to drive changing current through a loudspeaker voice coil. In a fixed magnetic field, the current produces a reversing force, moving the coil and attached cone in and out and making air-pressure variations. A stereo programme has two channels; each can feed several drivers. This is a functional schematic with a generic speaker section, not Porsche wiring or factory speaker construction.</desc>
  <defs>
    <marker id="information-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#53675d"/></marker>
    <marker id="power-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a4602f"/></marker>
    <marker id="drive-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#176b53"/></marker>
    <marker id="motion-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#203e33"/></marker>
  </defs>
  <rect width="600" height="1170" fill="#f4f3ec"/>
  <g fill="#203e33">
    <text x="30" y="43" font-size="30" font-weight="bold">Music controls electrical energy</text>
    <text x="30" y="78" font-size="24" fill="#53675d">Functional schematic · no factory wiring</text>
  </g>

  <g fill="#fff" stroke="#72887b" stroke-width="2">
    <rect x="30" y="110" width="220" height="98" rx="6"/>
    <rect x="330" y="110" width="240" height="98" rx="6"/>
    <rect x="30" y="290" width="220" height="116" rx="6" stroke="#a4602f"/>
    <rect x="330" y="290" width="240" height="116" rx="6"/>
  </g>
  <g font-size="28" fill="#203e33" text-anchor="middle">
    <text x="140" y="148" font-weight="bold">Source</text>
    <text x="140" y="183" font-size="26">music programme</text>
    <text x="450" y="148" font-weight="bold">Head unit</text>
    <text x="450" y="183" font-size="26">select / adjust</text>
    <text x="140" y="326" font-weight="bold">Vehicle supply</text>
    <text x="140" y="359" font-size="26">battery +</text>
    <text x="140" y="390" font-size="26">charging system</text>
    <text x="450" y="332" font-weight="bold">Amplifier</text>
    <text x="450" y="368" font-size="27">output stage</text>
  </g>
  <g fill="none" stroke="#53675d" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#information-arrow)">
    <path d="M250 159H330"/>
    <path d="M450 208V290"/>
  </g>
  <text x="30" y="251" font-size="26" fill="#53675d">Dashed: audio information</text>
  <path d="M250 348H330" fill="none" stroke="#a4602f" stroke-width="6" marker-end="url(#power-arrow)"/>
  <text x="30" y="444" font-size="26" fill="#a4602f">Orange: DC supply energy</text>
  <text x="30" y="489" font-size="27" fill="#203e33">The amplifier uses this energy</text>
  <text x="30" y="523" font-size="27" fill="#203e33">to drive changing coil current.</text>
  <path d="M550 406V596" fill="none" stroke="#176b53" stroke-width="6" marker-end="url(#drive-arrow)"/>
  <text x="30" y="559" font-size="23" fill="#53675d">Output stage may be inside the head unit.</text>

  <rect x="20" y="596" width="560" height="392" rx="7" fill="#fff" stroke="#72887b" stroke-width="2"/>
  <text x="40" y="635" font-size="29" font-weight="bold" fill="#203e33">Current becomes movement</text>
  <text x="40" y="669" font-size="24" fill="#53675d">Generic moving-coil driver · section</text>

  <!-- Fixed magnetic assembly around a freely moving coil; shapes are explanatory. -->
  <g fill="#d7dfd7" stroke="#72887b" stroke-width="3">
    <path d="M66 720H178V751H112V809H178V840H66Z"/>
    <path d="M112 772H207V788H112Z"/>
  </g>
  <!-- The coil former and attached cone move together along the horizontal axis. -->
  <g stroke="#203e33" stroke-width="3" fill="#e2e9e0">
    <path d="M211 752 359 702V720L222 768V792L359 840V858L211 808Z"/>
    <path d="M151 758H222V802H151Z" fill="none"/>
  </g>
  <g stroke="#a4602f" stroke-width="4" fill="none">
    <path d="M165 754V766M177 754V766M189 754V766M201 754V766M165 794V806M177 794V806M189 794V806M201 794V806"/>
  </g>
  <g fill="none" stroke="#176b53" stroke-width="4" stroke-linecap="round">
    <path d="M392 748Q420 780 392 812M426 730Q472 780 426 830M465 712Q530 780 465 848"/>
  </g>
  <path d="M253 695H337" fill="none" stroke="#203e33" stroke-width="3" marker-start="url(#motion-arrow)" marker-end="url(#motion-arrow)"/>
  <g font-size="26" fill="#203e33">
    <text x="40" y="706">Voice coil</text>
    <path d="M153 702 177 754" fill="none" stroke="#53675d" stroke-width="2"/>
    <text x="387" y="706">Sound</text>
    <text x="45" y="884">Fixed magnet</text>
    <path d="M127 857V840" fill="none" stroke="#53675d" stroke-width="2"/>
    <text x="285" y="895">Cone: in / out</text>
    <path d="M335 870 338 850" fill="none" stroke="#53675d" stroke-width="2"/>
    <text x="40" y="938">Coil current + fixed magnetic field</text>
    <text x="40" y="972">→ force on coil and attached cone</text>
  </g>

  <g fill="#203e33" font-size="27">
    <text x="30" y="1030">Current reverses → force reverses.</text>
    <text x="30" y="1065">Cone pushes / pulls air → sound.</text>
  </g>
  <path d="M30 1090H570" stroke="#72887b" stroke-width="2"/>
  <g fill="#53675d" font-size="26">
    <text x="30" y="1126">Stereo: two programme channels.</text>
    <text x="30" y="1160">Each can feed more than one driver.</text>
  </g>
</svg>
