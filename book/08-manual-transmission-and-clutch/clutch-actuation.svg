<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Clamping and releasing a dry clutch</title>
  <desc id="desc">In the upper section the pedal is up and spring pressure clamps the driven plate between flywheel and pressure plate. In the lower section the pedal is down, the release bearing acts on the spring and the plate is free to turn at a different speed. The pedal sends force through master cylinder, hydraulic fluid, slave cylinder and release lever. Geometry and clearances are illustrative.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#286449"/></marker></defs>
  <rect width="600" height="500" fill="#f1f4ef"/>
  <text x="25" y="35" font-size="26" fill="#243d32">One friction plate, two working faces</text>
  <path d="M260 76V102M354 76 303 112M450 100 331 105" stroke="#8da195" fill="none" stroke-width="2"/>
  <g font-size="20" fill="#243d32" text-anchor="middle"><text x="260" y="70">Flywheel</text><text x="354" y="70">Plate</text><text x="450" y="70">Pressure</text><text x="450" y="94">plate</text></g>
  <g stroke="#243d32" stroke-width="2">
    <path d="M215 153H558" stroke="#8da195" stroke-width="15"/>
    <rect x="241" y="102" width="47" height="108" fill="#8da195"/>
    <rect x="288" y="113" width="14" height="87" fill="#bb774b"/><rect x="302" y="113" width="14" height="87" fill="#bb774b"/>
    <rect x="316" y="105" width="29" height="104" fill="#8da195"/>
    <path d="M345 109 444 153 345 205" fill="none" stroke-width="5"/>
    <rect x="445" y="138" width="24" height="30" fill="#d6dfd5"/>
    <path d="M215 298H558" stroke="#8da195" stroke-width="15"/>
    <rect x="241" y="249" width="47" height="105" fill="#8da195"/>
    <rect x="316" y="259" width="14" height="86" fill="#bb774b"/><rect x="333" y="259" width="14" height="86" fill="#bb774b"/>
    <rect x="369" y="252" width="29" height="103" fill="#8da195"/>
    <path d="M398 254 431 299 398 352" fill="none" stroke-width="5"/>
    <rect x="432" y="285" width="24" height="30" fill="#d6dfd5"/>
  </g>
  <g fill="#243d32" font-size="21"><text x="25" y="129">Pedal up</text><text x="25" y="159">Clamped</text><text x="25" y="275">Pedal down</text><text x="25" y="305">Released</text></g>
  <g fill="none" stroke="#286449" stroke-width="4" marker-end="url(#arrow)"><path d="M264 183H287"/><path d="M374 183H319"/><path d="M504 299H463"/></g>
  <g fill="#4c6155" font-size="20" text-anchor="middle"><text x="478" y="234">Release bearing → spring</text><text x="430" y="384">Input shaft → gearbox</text></g>
  <path d="M25 408H575" stroke="#bbc8bc" stroke-width="2"/>
  <g fill="#243d32" font-size="21" text-anchor="middle"><text x="102" y="443">Pedal → master</text><text x="299" y="443">Fluid → slave</text><text x="497" y="443">Lever → bearing</text></g>
  <text x="300" y="482" text-anchor="middle" font-size="20" fill="#4c6155">Axial section · clearances exaggerated</text>
</svg>
