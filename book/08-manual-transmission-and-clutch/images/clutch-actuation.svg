    <rect x="195" y="1263" width="8" height="54" fill="#8da195"/>
    <path d="M85 1290H195" stroke-width="5"/>
    <path d="M291 1290H535V1390H511" stroke="#286449" stroke-width="5"/>
    <rect x="398" y="1362" width="113" height="56" rx="4" fill="#d6dfd5"/>
    <rect x="430" y="1363" width="8" height="54" fill="#8da195"/>
    <path d="M430 1390H350" stroke-width="5"/>
    <path d="M350 1338V1477" stroke-width="8"/>
    <path d="M338 1321H362L350 1338Z" fill="#8da195"/>
    <circle cx="350" cy="1338" r="7" fill="#f1f4ef"/>
    <path d="M350 1455H298" stroke-width="5"/>
    <rect x="270" y="1439" width="28" height="32" rx="3" fill="#d6dfd5"/>
    <path d="M239 1419 270 1455 239 1491" stroke-width="5"/>
  </g>
  <g fill="#243d32" font-size="28">
    <text x="130" y="1346" font-size="25">Master cylinder</text>
    <text x="396" y="1457">Slave</text><text x="396" y="1489">cylinder</text>
    <text x="24" y="1415">Pedal</text>
    <text x="24" y="1480">Bearing</text>
    <text x="288" y="1526">Pivoted lever</text>
  </g>
  <text x="243" y="1235" text-anchor="middle" font-size="23" fill="#243d32">Reservoir</text>
  <text x="325" y="1274" font-size="26" fill="#286449">Fluid pressure</text>
  <g fill="none" stroke="#286449" stroke-width="4" marker-end="url(#clutch-arrow)">
    <path d="M27 1343H72"/><path d="M364 1434H311"/>
  </g>
  <path d="M124 1472 265 1457" stroke="#8da195" stroke-width="2" fill="none"/>
  <g font-size="23" fill="#4c6155">
    <text x="24" y="1576">Arrows: axial force / movement, not rotation.</text>
    <text x="24" y="1609">Schematic · release gaps and motion enlarged.</text>
  </g>
</svg>
