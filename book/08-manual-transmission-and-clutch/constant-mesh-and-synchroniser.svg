<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 545" font-family="sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Always meshed, selectively locked</title>
<desc id="desc">A conceptual two-ratio gearbox has two fixed gears on the input shaft driving two free-running gears on the output shaft. The sleeve locks the right-hand gear to the output shaft. Its left-hand neighbour remains free-running. The three steps below are cone friction, speed matching and sleeve teeth locking. These are symbolic gear circles, not the G87/10's literal shaft layout or tooth counts.</desc>
