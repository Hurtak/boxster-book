<svg xmlns="http://www.w3.org/2000/svg" width="600" height="580" viewBox="0 0 600 580" font-family="sans-serif" role="img" aria-label="The coolant heater gives heat to cabin air; the refrigeration loop carries cabin heat outside">
  <defs><marker id="warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b64e2b"/></marker><marker id="cool" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2875a4"/></marker></defs>
  <rect width="600" height="580" fill="#fafbf9"/>
  <g fill="#263e34" font-size="26"><text x="25" y="37">The heater supplies heat</text><text x="25" y="269">A/C carries heat outside</text></g>
  <g fill="#f4e5dc" stroke="#b64e2b" stroke-width="2"><rect x="25" y="67" width="190" height="80" rx="8"/><rect x="365" y="67" width="210" height="80" rx="8"/></g>
  <g fill="none" stroke="#b64e2b" stroke-width="4" marker-end="url(#warm)"><path d="M215 91H360"/><path d="M365 128H220"/><path d="M470 149V182"/></g>
  <g text-anchor="middle" fill="#263e34" font-size="23"><text x="120" y="100">Engine</text><text x="120" y="129">coolant</text><text x="470" y="100">Heater core</text><text x="470" y="129">heat exchanger</text><text x="470" y="211" fill="#b64e2b">Cabin air warms</text></g>
  <g fill="#e7f0f5" stroke="#2875a4" stroke-width="2"><rect x="25" y="309" width="220" height="80" rx="8"/><rect x="355" y="309" width="220" height="80" rx="8"/><rect x="355" y="445" width="220" height="80" rx="8"/><rect x="25" y="445" width="220" height="80" rx="8"/></g>
  <g fill="none" stroke="#2875a4" stroke-width="4" marker-end="url(#cool)"><path d="M245 349H350"/><path d="M465 389V440"/><path d="M355 485H250"/><path d="M135 445V394"/></g>
  <g text-anchor="middle" fill="#263e34" font-size="23"><text x="135" y="342">Evaporator</text><text x="135" y="371">absorbs cabin heat</text><text x="465" y="342">Compressor</text><text x="465" y="371">adds work</text><text x="465" y="478">Front condensers</text><text x="465" y="507">reject heat outside</text><text x="135" y="478">Expansion valve</text><text x="135" y="507">meters refrigerant</text></g>
  <text x="300" y="565" text-anchor="middle" fill="#52665b" font-size="21">Two closed fluid circuits; heat crosses their walls.</text>
</svg>
