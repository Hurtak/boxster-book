<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480" font-family="sans-serif" role="img" aria-label="Fresh air passes through the blower and evaporator, bypasses the heater and reaches the face vents">
  <defs><marker id="cabin-route-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2875a4"/></marker></defs>
  <rect width="600" height="480" fill="#fafbf9"/>
  <g fill="#edf2ef" stroke="#263e34" stroke-width="2"><rect x="140" y="12" width="320" height="72" rx="8"/><rect x="140" y="115" width="320" height="72" rx="8"/><rect x="20" y="220" width="260" height="72" rx="8"/><rect x="320" y="220" width="260" height="72" rx="8"/><rect x="140" y="355" width="320" height="72" rx="8"/></g>
  <g fill="none" stroke="#2875a4" stroke-width="5" marker-end="url(#cabin-route-arrow)"><path d="M300 84V112"/><path d="M300 187V202H150V216"/><path d="M280 256H316"/><path d="M450 292V326H300V351"/></g>
  <g text-anchor="middle" fill="#263e34" font-size="24"><text x="300" y="43">Fresh outside air</text><text x="300" y="146">Blower</text><text x="150" y="251">Evaporator</text><text x="450" y="251">Heater / bypass</text><text x="300" y="386">Face vents</text></g>
  <g text-anchor="middle" fill="#263e34" font-size="21"><text x="300" y="71">Inlet + filter</text><text x="300" y="174">Moves the air</text><text x="150" y="279" fill="#2875a4">Cooling + drying*</text><text x="450" y="279">Bypass heater</text><text x="300" y="414">Chosen destination</text><text x="300" y="463">*Drying requires moisture to condense.</text></g>
</svg>
