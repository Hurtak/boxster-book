<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1200" viewBox="0 0 600 1200" font-family="'Source Sans 3', sans-serif" role="img" aria-labelledby="cabin-route-title cabin-route-desc">
  <title id="cabin-route-title">Cabin air route: fresh-air cooling example</title>
  <desc id="cabin-route-desc">Fresh outside air passes through the inlet filter, inlet flap, blower and evaporator. Air bypasses the heater core, reaches the mixing area and is directed to the face vents. Recirculation, heater and other outlets are dashed as unselected. A/C cooling depends on refrigerant output; drying needs condensation. Arrows represent air, not coolant or refrigerant.</desc>
  <defs>
    <marker id="cabin-route-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#263e34"/></marker>
    <marker id="cabin-route-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2875a4"/></marker>
  </defs>
  <rect width="600" height="1200" fill="#fafbf9"/>
  <g fill="#edf2ef" stroke="#263e34" stroke-width="2">
    <rect x="16" y="54" width="264" height="140" rx="8"/>
    <rect x="182" y="220" width="236" height="60" rx="8"/>
    <rect x="66" y="318" width="468" height="90" rx="8"/>
    <rect x="66" y="448" width="468" height="140" rx="8" stroke="#2875a4"/>
    <rect x="16" y="636" width="264" height="106" rx="8" stroke="#2875a4"/>
    <rect x="164" y="790" width="272" height="90" rx="8" stroke="#2875a4"/>
    <rect x="152" y="918" width="296" height="64" rx="8" stroke="#2875a4"/>
    <rect x="8" y="1040" width="184" height="62" rx="8" stroke="#2875a4"/>
  </g>
  <g fill="#f7f8f6" stroke="#7d8b83" stroke-width="2" stroke-dasharray="6 5">
    <rect x="320" y="54" width="264" height="140" rx="8"/>
    <rect x="320" y="636" width="264" height="106" rx="8"/>
    <rect x="208" y="1040" width="184" height="62" rx="8"/>
    <rect x="408" y="1040" width="184" height="62" rx="8"/>
  </g>
  <g fill="none" stroke="#7d8b83" stroke-width="3" stroke-dasharray="6 5">
    <path d="M452 194V250H418"/>
    <path d="M300 604H452V636M452 742V835H436"/>
    <path d="M300 982V1010H500V1040M300 1010V1040"/>
  </g>
  <g fill="none" stroke="#263e34" stroke-width="5" marker-end="url(#cabin-route-arrow)">
    <path d="M148 194V250H182"/>
    <path d="M300 280V318"/>
    <path d="M300 408V448"/>
  </g>
  <g fill="none" stroke="#2875a4" stroke-width="5" marker-end="url(#cabin-route-blue)">
    <path d="M300 588V604H148V636"/>
    <path d="M148 742V835H164"/>
    <path d="M300 880V918"/>
    <path d="M300 982V1010H100V1040"/>
  </g>
  <g text-anchor="middle" fill="#263e34" font-size="30">
    <text x="300" y="30" font-size="27">Solid arrows: selected air path</text>
    <text x="148" y="88">Fresh outside air</text>
    <text x="148" y="132" font-size="28">Inlet → filter</text>
    <text x="148" y="176" font-size="27">Selected</text>
    <text x="300" y="260">Inlet flap</text>
    <text x="300" y="354">Blower</text>
    <text x="300" y="398" font-size="28">Creates airflow</text>
    <text x="300" y="480">Evaporator</text>
    <text x="300" y="524" font-size="28" fill="#2875a4">A/C enabled: may cool + dry*</text>
    <text x="300" y="568" font-size="27">Drying needs condensation</text>
    <text x="148" y="675">Bypass</text>
    <text x="148" y="719" font-size="28">Skips heater</text>
    <text x="300" y="823">Mixing / blend</text>
    <text x="300" y="867" font-size="28">Bypass air only</text>
    <text x="300" y="960">Outlet flaps</text>
    <text x="100" y="1080" font-size="29">Face vents</text>
  </g>
  <g text-anchor="middle" fill="#7d8b83" font-size="30">
    <text x="452" y="88">Cabin air</text>
    <text x="452" y="132" font-size="28">Recirculation</text>
    <text x="452" y="176" font-size="27">Not selected</text>
    <text x="452" y="675">Heater core</text>
    <text x="452" y="719" font-size="28">Route closed</text>
    <text x="300" y="1080" font-size="29">Footwell</text>
    <text x="500" y="1080" font-size="29">Windscreen</text>
  </g>
  <text x="300" y="1140" text-anchor="middle" font-size="27" fill="#263e34">*Compressor output has limits.</text>
  <text x="300" y="1180" text-anchor="middle" font-size="27" fill="#263e34">Air arrows; other fluid circuits not drawn.</text>
</svg>
