<svg xmlns="http://www.w3.org/2000/svg" width="400" height="480" viewBox="0 0 400 480" role="img" aria-labelledby="title desc"><title id="title">Optional seat ventilation: seat and blower locations</title><desc id="desc">Side cutaway of a standard or comfort seat fitted with optional ventilation. The tall integrated head restraint and reclined backrest follow Porsche seat references. Air enters the occupant-facing side of the backrest and the top of the cushion. Independent passages lead to the rear backrest blower and the blower beneath the cushion; both exhaust to the cabin. Bolsters, hardware and concealed paths are simplified.</desc><defs><marker id="air-arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="9" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#2c7895"/></marker><pattern id="spacer-mesh" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 9L4.5 0L9 9M0 4.5H9" fill="none" stroke="#467f70" stroke-width=".8"/></pattern><pattern id="foam" width="15" height="15" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.2" fill="#bfa782"/><circle cx="11" cy="10" r="1.6" fill="none" stroke="#c6af8b" stroke-width=".7"/></pattern></defs><rect width="400" height="480" fill="#fff"/><g font-family="Arial, sans-serif" fill="#243e34"><path id="support-foam" d="M98 43Q100 28 118 33Q132 38 138 58Q143 72 132 82L190 310Q198 343 216 344L347 333Q361 333 368 342Q379 353 370 365L214 379Q185 379 174 354Z" fill="#e2c8a3" stroke="#a37a4a" stroke-width="2"/><path d="M98 43Q100 28 118 33Q132 38 138 58Q143 72 132 82L190 310Q198 343 216 344L347 333Q361 333 368 342Q379 353 370 365L214 379Q185 379 174 354Z" fill="url(#foam)"/><path d="M102 56L173 344Q179 367 204 371L367 358" fill="none" stroke="#b59a76" stroke-width="5"/>
