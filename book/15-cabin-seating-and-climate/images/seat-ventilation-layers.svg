<svg xmlns="http://www.w3.org/2000/svg" width="400" height="480" viewBox="0 0 400 480" role="img" aria-labelledby="title desc"><title id="title">Ventilated cushion layers and inlet-face view of the blower</title><desc id="desc">Enlarged functional cushion section: a perforated leather cover lies above an air-permeable spacer mat and vented foam. Distributed passages feed the ring-shaped fan inlet around its central motor. The separate inlet-face view of the cushion blower follows replacement-part photographs: circular foam seal, many-bladed impeller, motor cap, mounting tabs and tangential outlet. Layer spacing and connecting duct are unfolded, not measured.</desc><defs><marker id="air-arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="9" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#2c7895"/></marker><pattern id="spacer-mesh" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 9L4.5 0L9 9M0 4.5H9" fill="none" stroke="#467f70" stroke-width=".8"/></pattern><pattern id="foam" width="15" height="15" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.2" fill="#bfa782"/><circle cx="11" cy="10" r="1.6" fill="none" stroke="#c6af8b" stroke-width=".7"/></pattern></defs><rect width="400" height="480" fill="#fff"/><g font-family="Arial, sans-serif" fill="#243e34"><rect id="cover-detail" x="55" y="57" width="290" height="10" rx="2" fill="#c39a6c" stroke="#9a673b" stroke-width="1.4"/>
