<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 960" role="img" aria-labelledby="title desc" font-family="sans-serif">
<title id="title">A functional map of the instrument panel and driver controls</title><desc id="desc">Three schematic instrument dials identify analogue road speed, central engine speed with digital road speed and the on-board-computer display, and the right-hand information area including PDK information when fitted. Further groups identify column stalks, optional cruise and multifunction controls, audio/climate panels and console roof/mode switches. Arrangement is grouped by function rather than a literal left- or right-hand-drive dashboard or a complete switch inventory.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="960" fill="#f1f4f2"/>
