<title id="title">The 987.2 has permanent rollover supports</title><desc id="desc">The steel-reinforced windscreen frame stands ahead of the occupants, and two fixed high-strength steel bars stand behind the seats. The upper belt anchorages are attached to the rear bars. No deployable extension is shown or fitted to this schematic arrangement.</desc>
