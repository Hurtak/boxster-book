<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1400" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">Three-point belt routing and three restraint functions</title>
  <desc id="desc">A front-view occupant schematic shows the shoulder belt across the chest and the lap belt low across the pelvis. The upper anchorage is on the Boxster's rear rollover bar; a lower outer body anchorage and the inboard seat-mounted buckle complete the three-point restraint. Loads pass from occupant through webbing, body anchorages and the seat structure into the passenger cell. Separate functional symbols explain reel locking against free payout, pretensioning to remove slack when triggered, and force limiting by controlled yielding under load. Component positions, internal designs, travel, force and trigger thresholds are not depicted.</desc>
  <defs>
    <marker id="belt-load-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#a56430" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="belt-motion-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 8 4.5 1 8" fill="none" stroke="#1e6250" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="600" height="1400" rx="14" fill="#f5f7f2"/>
  <g fill="#173f32">
    <text x="26" y="43" font-size="30" font-weight="bold">Belt routing and restraint functions</text>
    <text x="26" y="80" font-size="24" fill="#526b5d">2010 Boxster · functional schematic</text>
  </g>

  <!-- Front view makes the chest and low pelvic routes distinct. -->
  <path d="M231 245Q300 217 369 245L389 412H214Z" fill="#dbe4dc" stroke="#aabbb0" stroke-width="5"/>
  <circle cx="301" cy="174" r="37" fill="#e9cfad" stroke="#74897e" stroke-width="3"/>
  <path d="M285 209V234H318V209" fill="#e9cfad"/>
  <path d="M250 241Q300 229 352 241L369 347L353 369H249L234 347Z" fill="#e9cfad" stroke="#bba485" stroke-width="3"/>
  <path d="M248 353H354L371 413H235Z" fill="#dbc09e" stroke="#bba485" stroke-width="3"/>
  <path d="M236 255L215 340M370 255L397 340M263 426L246 478M342 426L363 478" fill="none" stroke="#bba485" stroke-width="24" stroke-linecap="round"/>
  <path d="M224 485H404M388 466V485" fill="none" stroke="#aabbb0" stroke-width="10" stroke-linecap="round"/>
  <path d="M183 208L246 248L382 407L351 396H248L205 413" fill="none" stroke="#1e6250" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M383 417L388 465" fill="none" stroke="#526b5d" stroke-width="10"/>
  <g fill="#173f32" stroke="#f5f7f2" stroke-width="3">
    <circle cx="183" cy="208" r="12"/>
    <circle cx="205" cy="413" r="12"/>
    <circle cx="388" cy="465" r="12"/>
  </g>
  <rect x="370" y="394" width="27" height="31" rx="5" fill="#173f32" stroke="#f5f7f2" stroke-width="2"/>
  <rect x="377" y="400" width="13" height="7" rx="2" fill="#a56430"/>
  <g fill="none" stroke="#74897e" stroke-width="2">
    <path d="M176 164L182 194"/>
    <path d="M407 299L317 331"/>
    <path d="M165 358L262 396"/>
    <path d="M192 447L196 424"/>
    <path d="M410 449L399 460"/>
  </g>
  <g fill="#173f32" font-size="28">
    <text x="26" y="132">Upper anchor</text>
    <text x="26" y="164" font-size="24" fill="#526b5d">on rear bar</text>
    <text x="401" y="254">Shoulder belt</text>
    <text x="401" y="286">Across chest</text>
    <text x="26" y="302" font-weight="bold">Lap belt</text>
    <text x="26" y="334">Low across</text>
    <text x="26" y="366">pelvis</text>
    <text x="26" y="457">Lower anchor</text>
    <text x="416" y="421">Buckle /</text>
    <text x="416" y="453">seat mount</text>
  </g>

  <text x="300" y="527" text-anchor="middle" fill="#173f32" font-size="28" font-weight="bold">Restraint load path</text>
  <text x="300" y="568" text-anchor="middle" fill="#173f32" font-size="28">Occupant → belt → body / seat</text>
  <path d="M300 579V600" fill="none" stroke="#a56430" stroke-width="3" marker-end="url(#belt-load-arrow)"/>
  <rect x="145" y="610" width="310" height="54" rx="9" fill="#dbe4dc" stroke="#74897e" stroke-width="2"/>
  <text x="300" y="647" text-anchor="middle" fill="#173f32" font-size="28">Passenger cell</text>

  <text x="26" y="712" fill="#173f32" font-size="28" font-weight="bold">Three complementary functions</text>
  <g fill="#fff" stroke="#aabbb0" stroke-width="2">
    <rect x="24" y="734" width="552" height="176" rx="10"/>
    <rect x="24" y="926" width="552" height="176" rx="10"/>
    <rect x="24" y="1118" width="552" height="176" rx="10"/>
  </g>

  <!-- Motion symbols describe functions, not the installed hardware. -->
  <g fill="none" stroke="#1e6250" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="86" cy="812" r="26"/>
    <path d="M86 798Q101 798 100 811Q100 823 87 823Q77 823 77 813Q77 806 85 806M111 812H157"/>
    <path d="M137 787H166" marker-end="url(#belt-motion-arrow)"/>
    <path d="M168 802V827" stroke="#a56430" stroke-width="6"/>
  </g>
  <text x="108" y="872" text-anchor="middle" fill="#526b5d" font-size="24">Stop payout</text>
  <g fill="#173f32">
    <text x="195" y="774" font-size="30" font-weight="bold">Reel locking</text>
    <text x="195" y="812" font-size="27">Slow pull: reel pays out.</text>
    <text x="195" y="844" font-size="27">Rapid deceleration locks</text>
    <text x="195" y="876" font-size="27">against free payout.</text>
  </g>

  <path d="M53 1006Q76 1051 98 1006T154 1006" fill="none" stroke="#aabbb0" stroke-width="5" stroke-dasharray="7 5"/>
  <path d="M53 1006H154" fill="none" stroke="#1e6250" stroke-width="5"/>
  <path d="M137 982H72" fill="none" stroke="#1e6250" stroke-width="5" marker-end="url(#belt-motion-arrow)"/>
  <text x="107" y="1064" text-anchor="middle" fill="#526b5d" font-size="24">Take up slack</text>
  <g fill="#173f32">
    <text x="195" y="966" font-size="30" font-weight="bold">Pretensioning</text>
    <text x="195" y="1004" font-size="27">When triggered, takes up</text>
    <text x="195" y="1036" font-size="27">slack so restraint begins</text>
    <text x="195" y="1068" font-size="27">with less free movement.</text>
  </g>

  <path d="M51 1184V1220M51 1202H110" fill="none" stroke="#1e6250" stroke-width="6"/>
  <path d="M110 1202H160" fill="none" stroke="#1e6250" stroke-width="5" stroke-dasharray="6 5"/>
  <path d="M107 1176H158" fill="none" stroke="#a56430" stroke-width="3" marker-end="url(#belt-load-arrow)"/>
  <text x="108" y="1256" text-anchor="middle" fill="#526b5d" font-size="24">Controlled give</text>
  <g fill="#173f32">
    <text x="195" y="1158" font-size="30" font-weight="bold">Force limiting</text>
    <text x="195" y="1196" font-size="27">Under load, controlled give</text>
    <text x="195" y="1228" font-size="27">manages the force carried</text>
    <text x="195" y="1260" font-size="27">by the belt.</text>
  </g>
  <g fill="#526b5d" font-size="24">
    <text x="26" y="1336">Symbols show functions, not hardware locations.</text>
    <text x="26" y="1372">No measured forces, belt travel or trigger thresholds.</text>
  </g>
</svg>
