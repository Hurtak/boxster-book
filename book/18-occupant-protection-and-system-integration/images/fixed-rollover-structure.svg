<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 990" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">Permanent rollover structure around two side-by-side seats</title>
  <desc id="desc">For the MY2010 Boxster 987.2, a side schematic locates the steel-reinforced metal windscreen frame ahead of a seat and a fixed high-strength steel rear bar behind it. Glass is separate from the reinforced frame. A transverse view looking rearwards shows the two rear bars and two seats side by side, with the bars continuing into the body structure and the upper belt anchorages attached to them. Grey seats and headrests are distinct from the green steel structure; trim covers and the hood are omitted. Connections and belt anchorage positions are schematic, not mounting coordinates. The structure is permanently present, with no pop-up extension. Neither view predicts rollover clearance, structural loads or a crash outcome.</desc>
  <rect width="600" height="990" rx="14" fill="#f5f7f2"/>
  <g fill="#173f32">
    <text x="24" y="42" font-size="30" font-weight="bold">Permanent rollover structure</text>
    <text x="24" y="77" font-size="24" fill="#536f61">MY2010 Boxster 987.2 · no pop-up bars</text>
  </g>
  <path d="M24 98H576 M24 482H576" stroke="#cbd7ce" stroke-width="2"/>

  <!-- One lateral position only: the second seat/bar is beside it, not behind it. -->
  <text x="24" y="131" font-size="24" fill="#536f61">SIDE · one seat and one bar shown</text>
  <g font-size="27" fill="#173f32">
    <text x="24" y="172">Reinforced metal</text>
    <text x="24" y="204">windscreen frame</text>
    <text x="353" y="172">High-strength</text>
    <text x="353" y="204">fixed steel bar</text>
  </g>
  <g fill="none" stroke="#899e92" stroke-width="2.5">
    <path d="M190 215L234 240"/>
    <path d="M438 214L422 259"/>
  </g>

  <!-- Body and supports are conceptual continuities, without fastener geometry. -->
  <path d="M42 407V380L113 352H177L190 367H458L484 353L553 374V407Z" fill="#e0e9e1" stroke="#739181" stroke-width="3"/>
  <path d="M64 400H535" stroke="#739181" stroke-width="12"/>
  <path d="M171 401L177 354L238 238H260" fill="none" stroke="#1d6550" stroke-width="15" stroke-linejoin="round"/>
  <path d="M189 347L245 253" stroke="#93bdcf" stroke-width="9"/>
  <path d="M421 400L416 277Q415 258 427 258" fill="none" stroke="#1d6550" stroke-width="17" stroke-linecap="round"/>
  <path d="M307 354L346 351L333 308" fill="none" stroke="#a6b7a9" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="316" y="271" width="33" height="42" rx="12" fill="#a6b7a9"/>
  <text x="25" y="303" font-size="27" fill="#306b95">Glass</text>
  <path d="M105 297L211 309" fill="none" stroke="#899e92" stroke-width="2.5"/>
  <text x="25" y="451" font-size="27" fill="#173f32">Frame and bars connect to the body</text>
  <g fill="none" stroke="#899e92" stroke-width="2.5">
    <path d="M173 423V406 M422 423V409"/>
  </g>
  <text x="493" y="338" text-anchor="middle" font-size="24" fill="#536f61">← Front</text>

  <!-- Transverse view resolves the side-by-side occupant/bar arrangement. -->
  <text x="24" y="522" font-size="24" fill="#536f61">ACROSS THE CAR · looking rearwards</text>
  <text x="300" y="559" text-anchor="middle" font-size="27" fill="#173f32">Two seats and bars, side by side</text>
  <text x="300" y="603" text-anchor="middle" font-size="26" fill="#173f32">Upper belt anchorages on the bars</text>
  <path d="M74 786V764Q74 751 88 751H512Q526 751 526 764V811H74Z" fill="#e0e9e1" stroke="#739181" stroke-width="3"/>
  <path d="M93 792H507" stroke="#739181" stroke-width="14"/>
  <g stroke="#1d6550" stroke-width="17" fill="none" stroke-linejoin="round">
    <path d="M113 795V670Q113 635 148 635H212Q247 635 247 670V795"/>
    <path d="M353 795V670Q353 635 388 635H452Q487 635 487 670V795"/>
  </g>
  <g fill="#a6b7a9" stroke="#7b9283" stroke-width="2">
    <rect x="154" y="680" width="52" height="54" rx="15"/>
    <path d="M131 783V753Q131 729 155 729H205Q229 729 229 753V783Z"/>
    <rect x="394" y="680" width="52" height="54" rx="15"/>
    <path d="M371 783V753Q371 729 395 729H445Q469 729 469 753V783Z"/>
  </g>
  <g fill="#ae7039" stroke="#f5f7f2" stroke-width="3">
    <circle cx="113" cy="698" r="10"/>
    <circle cx="487" cy="698" r="10"/>
  </g>
  <g fill="none" stroke="#899e92" stroke-width="2.5">
    <path d="M101 614L93 654L109 687"/>
    <path d="M499 614L507 654L491 687"/>
  </g>
  <g font-size="27" fill="#173f32">
    <rect x="25" y="840" width="28" height="19" rx="4" fill="#a6b7a9"/>
    <text x="68" y="861">Seats and headrests</text>
    <path d="M26 889H53" stroke="#1d6550" stroke-width="12"/>
    <text x="68" y="899">Steel structure; trim omitted</text>
  </g>
  <g font-size="22" fill="#536f61" text-anchor="middle">
    <text x="300" y="945">Connections and belt anchors schematic.</text>
    <text x="300" y="975">No loads or rollover clearance predicted.</text>
  </g>
</svg>
