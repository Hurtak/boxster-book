<path d="M27 171H97M333 171H263" fill="none" stroke="#176b53" stroke-width="12" stroke-linecap="round"/>
<g fill="#dbeae1" stroke="#176b53" stroke-width="2.5" stroke-linejoin="round"><path d="M96 116L143 144V198L96 226Z"/><path d="M264 116L217 144V198L264 226Z"/></g>
<g fill="none" stroke="#176b53" stroke-width="1.5" stroke-linecap="round"><path d="M111 125L122 145M125 134L135 153M111 217L122 197M125 208L135 189M249 125L238 145M235 134L225 153M249 217L238 197M235 208L225 189"/></g>
<g fill="#f1dbc9" stroke="#9a4e22" stroke-width="2.5" stroke-linejoin="round"><path d="M143 144L156 116H204L217 144Z"/><path d="M143 198L156 226H204L217 198Z"/></g>
<rect x="116" y="88" width="128" height="23" fill="#f6f8f5"/>
<rect x="138" y="158" width="84" height="25" rx="4" fill="#f6f8f5"/>
<g text-anchor="middle" font-size="17"><text x="180" y="105" fill="#9a4e22">Spider pinions</text><text x="180" y="176" fill="#526159">Cross-pin</text></g>
<path d="M96 226V278M264 226V278" fill="none" stroke="#176b53" stroke-width="1.5" stroke-linecap="round"/>
<g text-anchor="middle" font-size="17" fill="#176b53"><text x="96" y="298">Left side gear</text><text x="264" y="298">Right side gear</text></g>
