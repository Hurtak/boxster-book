<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 650" font-family="'Source Sans 3', sans-serif" fill="#243e35" role="img" aria-labelledby="t d">
<title id="t">An open differential: gears and output-speed averaging</title>
<desc id="d">The ring gear drives the carrier and its cross-pin. Spider pinions on that pin mesh with both side gears, each fixed to an output shaft. With the carrier at 300 rpm, prescribed outputs of 240 and 360 rpm average back to 300 rpm. The pinions spin on the cross-pin to allow this difference. This is a functional section, not measured gear geometry or a tyre-slip simulation.</desc>
