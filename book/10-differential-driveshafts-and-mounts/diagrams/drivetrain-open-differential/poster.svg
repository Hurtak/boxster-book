<g text-anchor="middle"><text x="92.5" y="340" font-size="19">Left output</text><text x="267.5" y="340" font-size="19">Right output</text><text x="92.5" y="376" font-size="27" fill="#176b53">240 rpm</text><text x="267.5" y="376" font-size="27" fill="#9a4e22">360 rpm</text><text x="92.5" y="406" font-size="16">−60 vs carrier</text><text x="267.5" y="406" font-size="16">+60 vs carrier</text><text x="180" y="461" font-size="18">Pinions also spin on the cross-pin.</text><text x="180" y="489" font-size="18">One side gains what the other loses.</text><text x="180" y="525" font-size="23" fill="#176b53">240 + 360 = 2 × 300</text><text x="180" y="563" font-size="16">Cross-pin fixed to carrier; pinions free to spin.</text><text x="180" y="600" font-size="16" fill="#526159">Functional section; illustrative speeds.</text><text x="180" y="624" font-size="16" fill="#526159">No tyre-slip or vehicle-motion calculation.</text></g>
