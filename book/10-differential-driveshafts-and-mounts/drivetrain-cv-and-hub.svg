<text x="24" y="33" font-size="25">Two freedoms at the joints</text>
<rect x="30" y="97" width="60" height="105" rx="6" fill="#e2e8df" stroke="#7c8e7e"/><text x="30" y="76" font-size="21">Transaxle</text>
<path d="M90 149H500" stroke="#176b53" stroke-width="13"/><path d="M118 149L500 214" stroke="#738e7d" stroke-width="8" stroke-dasharray="9 7"/>
<circle cx="118" cy="149" r="25" fill="#e2e8df" stroke="#176b53" stroke-width="4"/><circle cx="500" cy="149" r="25" fill="#e2e8df" stroke="#176b53" stroke-width="4"/><circle cx="500" cy="214" r="25" fill="#fff" stroke="#738e7d" stroke-width="3" stroke-dasharray="6 4"/>
<path d="M83 232H156" stroke="#9a4e22" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="119" y="270" text-anchor="middle" font-size="22" fill="#9a4e22">Plunge</text>
