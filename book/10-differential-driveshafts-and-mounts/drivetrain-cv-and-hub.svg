<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="sans-serif" fill="#243e35" role="img" aria-labelledby="t d">
<title id="t">Half-shaft articulation, plunge and wheel-hub support</title><desc id="d">A shaft crosses between an inner joint at the transmission and an outer joint at the wheel. A dashed shaft shows an illustrative alternate wheel position. Axial plunge accommodates length change. A lower section separates the rotating hub from the fixed carrier through a bearing.</desc>
