<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 866" font-family="sans-serif" fill="#243e35" role="img" aria-labelledby="t d">
  <title id="t">Mid-engine layout, rear drive path and power-unit supports</title>
  <desc id="d">Functional plan view, with the front of the car at the top. The longitudinal engine is ahead of the rear wheel centre line. Behind it, the transaxle contains the gearbox, final drive and differential. Green arrows show the torque sequence: engine through the gearbox, then final drive and differential, then two half-shafts to the rear wheels. These arrows are not an internal shaft-routing drawing. Three numbered amber compliant supports connect the power-unit housings to the surrounding structure: one forward engine support and two transmission supports. They carry weight and react housing torque, separately from the rotating drive path. Positions and proportions are schematic, not measured mount coordinates.</desc>
  <defs>
    <marker id="drive-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#176b53"/>
    </marker>
  </defs>
  <rect width="560" height="866" fill="#fff"/>
  <text x="24" y="36" font-size="27">PLAN VIEW · front ↑</text>
  <text x="24" y="70" font-size="24">Engine ahead of the rear axle</text>

  <!-- Structure and housings: geometry is deliberately schematic. -->
  <rect x="92" y="92" width="376" height="508" rx="20" fill="#f5f6f2" stroke="#cad2c9" stroke-width="3"/>
  <text x="112" y="128" font-size="24" fill="#526159">Structure</text>
  <rect x="170" y="175" width="220" height="110" rx="15" fill="#dfe9df" stroke="#738e7d" stroke-width="2"/>
  <text x="280" y="218" text-anchor="middle" font-size="28">Engine</text>
  <text x="280" y="251" text-anchor="middle" font-size="24">Longitudinal</text>
  <rect x="160" y="310" width="240" height="270" rx="18" fill="#eef3ee" stroke="#738e7d" stroke-width="2"/>
  <text x="280" y="566" text-anchor="middle" font-size="26">Transaxle</text>

  <!-- Wheel centre line is a spatial reference, not a solid axle. -->
  <path d="M15 392H545" fill="none" stroke="#cad2c9" stroke-width="3" stroke-dasharray="5 6"/>
  <g fill="#33483d">
    <rect x="32" y="350" width="38" height="84" rx="9"/>
    <rect x="490" y="350" width="38" height="84" rx="9"/>
  </g>
  <g text-anchor="middle" font-size="24">
    <text x="51" y="282">Left</text><text x="51" y="310">rear</text>
    <text x="509" y="282">Right</text><text x="509" y="310">rear</text>
    <text x="128" y="342">Half-shaft</text>
    <text x="448" y="342">Half-shaft</text>
  </g>

  <!-- The gearbox stage is drawn aft of the differential; arrows show
       functional order only, without claiming an internal shaft route. -->
  <rect x="190" y="350" width="180" height="84" rx="15" fill="#fff" stroke="#176b53" stroke-width="3"/>
  <text x="280" y="384" text-anchor="middle" font-size="25">Final drive</text>
  <text x="280" y="416" text-anchor="middle" font-size="24">+ differential</text>
  <rect x="190" y="474" width="180" height="60" rx="10" fill="#dfe9df" stroke="#738e7d" stroke-width="2"/>
  <text x="280" y="513" text-anchor="middle" font-size="26">Gearbox</text>
  <g fill="none" stroke="#176b53" stroke-width="5" marker-end="url(#drive-arrow)">
    <path d="M280 270V297H383V504H370"/>
    <path d="M280 474V434"/>
    <path d="M190 392H70"/>
    <path d="M370 392H490"/>
  </g>

  <!-- The amber links join housings to structure; they are not drive shafts. -->
  <g fill="none" stroke="#9a4e22" stroke-width="4" stroke-dasharray="6 5">
    <path d="M280 92V175"/>
    <path d="M92 551H160M400 551H468"/>
  </g>
  <g fill="#9a4e22" stroke="#fff" stroke-width="2">
    <circle cx="280" cy="159" r="18"/>
    <circle cx="139" cy="551" r="18"/>
    <circle cx="421" cy="551" r="18"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-size="24">
    <text x="280" y="167">1</text>
    <text x="139" y="559">2</text>
    <text x="421" y="559">2</text>
  </g>

  <path d="M24 634H66" fill="none" stroke="#176b53" stroke-width="5" marker-end="url(#drive-arrow)"/>
  <text x="84" y="642" font-size="24">Torque to the rear wheels</text>
  <path d="M24 676H66" fill="none" stroke="#9a4e22" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="84" y="684" font-size="24">Support loads to structure</text>
  <g font-size="24">
    <text x="24" y="730" fill="#9a4e22">1  Forward engine support</text>
    <text x="24" y="764" fill="#9a4e22">2  Two transmission supports</text>
  </g>
  <text x="24" y="803" font-size="23">Mounts carry weight and react housing torque.</text>
  <text x="24" y="834" font-size="21" fill="#526159">Positions and shaft routing are schematic.</text>
</svg>
