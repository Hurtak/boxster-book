<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1490" font-family="sans-serif" fill="#243e35" role="img" aria-labelledby="t d">
  <title id="t">CV-joint movement and the rotating wheel hub</title>
  <desc id="d">Three functional schematics. First, inner and outer CV joints transmit drive while changing angle as the wheel moves; the dashed shaft is an alternate position. Second, a separate generic joint envelope shows axial sliding, called plunge, without showing or assigning Porsche joint internals or the plunge location. Third, a section separates the splined drive through the rotating hub from the wheel bearing and non-rotating carrier. The bearing inner ring turns with the hub, while its outer ring stays with the carrier. Shapes, movement and bearing elements are symbolic, not measured car geometry.</desc>
  <defs>
    <marker id="cv-motion" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#9a4e22"/></marker>
    <marker id="cv-drive" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#176b53"/></marker>
  </defs>
  <rect width="600" height="1490" fill="#fff"/>

  <text x="24" y="38" font-size="29" font-weight="bold">1  Articulation changes the angle</text>
  <text x="24" y="81" font-size="27">Torque passes through both CV joints.</text>
  <text x="104" y="137" font-size="27" text-anchor="middle">Inner CV</text>
  <text x="450" y="137" font-size="27" text-anchor="middle">Outer CV</text>
  <path d="M122 147 139 165M450 147V165" stroke="#7c8e7e" stroke-width="2" fill="none"/>

  <!-- Joint centres and wheel motion are illustrative; no joint subtype is depicted. -->
  <rect x="24" y="163" width="62" height="63" rx="5" fill="#e2e8df" stroke="#7c8e7e" stroke-width="2"/>
  <path d="M86 194H553M553 164V224" fill="none" stroke="#176b53" stroke-width="12"/>
  <path d="M140 194 435 306H553M553 276V336" fill="none" stroke="#738e7d" stroke-width="7" stroke-dasharray="10 7"/>
  <circle cx="140" cy="194" r="25" fill="#e2e8df" stroke="#176b53" stroke-width="4"/>
  <circle cx="450" cy="194" r="25" fill="#e2e8df" stroke="#176b53" stroke-width="4"/>
  <circle cx="435" cy="306" r="25" fill="#fff" stroke="#738e7d" stroke-width="3" stroke-dasharray="7 5"/>
  <path d="M201 194A61 61 0 0 1 197 216M379 285A60 60 0 0 0 375 306" fill="none" stroke="#9a4e22" stroke-width="4"/>
  <path d="M235 170H375" stroke="#176b53" stroke-width="4" marker-end="url(#cv-drive)"/>
  <text x="24" y="264" font-size="27">Transaxle</text>
  <text x="272" y="359" font-size="27">Wheel end</text>
  <path d="M430 348 545 315" stroke="#7c8e7e" stroke-width="2" fill="none"/>
  <text x="24" y="409" font-size="27">Dashed: another suspension position.</text>
  <path d="M24 441H576" stroke="#d7dfd5" stroke-width="2"/>

  <text x="24" y="485" font-size="29" font-weight="bold">2  Plunge changes effective length</text>
  <text x="24" y="526" font-size="27">Joint members slide along the axis.</text>
  <text x="103" y="581" font-size="27">Joint envelope</text>
  <path d="M164 592V613" stroke="#7c8e7e" stroke-width="2"/>

  <!-- Motion envelope only: not a section of any particular joint construction. -->
  <path d="M344 619H91V719H344" fill="#e2e8df" stroke="#7c8e7e" stroke-width="3"/>
  <rect x="219" y="640" width="82" height="58" rx="3" fill="#b9cdbd" stroke="#176b53" stroke-width="3"/>
  <path d="M261 669H538" stroke="#176b53" stroke-width="12"/>
  <path d="M301 640H352V698H301" fill="none" stroke="#738e7d" stroke-width="3" stroke-dasharray="7 5"/>
  <path d="M226 749H348" fill="none" stroke="#9a4e22" stroke-width="4" marker-start="url(#cv-motion)" marker-end="url(#cv-motion)"/>
  <text x="375" y="758" font-size="27" fill="#9a4e22">Axial slide</text>
  <text x="24" y="808" font-size="27">The shaft itself does not stretch.</text>
  <text x="24" y="846" font-size="23" fill="#526159">Motion only; joint internals and location omitted.</text>
  <path d="M24 872H576" stroke="#d7dfd5" stroke-width="2"/>

  <text x="24" y="916" font-size="29" font-weight="bold">3  The hub turns inside its carrier</text>
  <text x="24" y="956" font-size="27">Drive: shaft → splines → hub → wheel.</text>

  <!-- Symbolic bearing section: rolling-element count and ring profiles are not specified. -->
  <path d="M218 1002H380V1043H218ZM218 1181H380V1222H218Z" fill="#e2e8df" stroke="#7c8e7e" stroke-width="2"/>
  <path d="M245 1043H353V1055H245ZM245 1169H353V1181H245Z" fill="#7c8e7e"/>
  <g fill="#fff" stroke="#7c8e7e" stroke-width="3">
    <circle cx="270" cy="1070" r="14"/><circle cx="328" cy="1070" r="14"/>
    <circle cx="270" cy="1154" r="14"/><circle cx="328" cy="1154" r="14"/>
  </g>
  <path d="M245 1084H353V1094H245ZM245 1130H353V1140H245Z" fill="#176b53"/>
  <path d="M180 1094H414V1036H439V1188H414V1130H180V1118H414V1106H180Z" fill="#b9cdbd" stroke="#176b53" stroke-width="2"/>
  <path d="M40 1112H475" stroke="#176b53" stroke-width="12"/>
  <g stroke="#fff" stroke-width="2">
    <path d="M190 1106V1118M200 1106V1118M210 1106V1118M220 1106V1118M230 1106V1118"/>
  </g>
  <path d="M42 1085H149" stroke="#176b53" stroke-width="4" marker-end="url(#cv-drive)"/>
  <text x="24" y="1019" font-size="27">Carrier</text>
  <path d="M124 1012H214" stroke="#243e35" stroke-width="2"/>
  <text x="24" y="1066" font-size="27">Bearing</text>
  <path d="M137 1059 253 1068" stroke="#243e35" stroke-width="2"/>
  <text x="24" y="1168" font-size="27">Shaft</text>
  <path d="M92 1158 126 1123" stroke="#243e35" stroke-width="2"/>
  <text x="24" y="1232" font-size="27">Splines</text>
  <path d="M133 1223H200V1118" stroke="#243e35" stroke-width="2" fill="none"/>
  <text x="426.5" y="1268" font-size="27" text-anchor="middle">Hub flange</text>
  <path d="M426.5 1240V1195" stroke="#243e35" stroke-width="2"/>

  <text x="24" y="1310" font-size="27">Hub + inner bearing ring rotate together.</text>
  <text x="24" y="1349" font-size="27">Outer ring stays with the carrier.</text>
  <text x="24" y="1388" font-size="27">Road loads: hub → bearing → carrier.</text>
  <text x="24" y="1427" font-size="27">Carrier follows suspension; does not spin.</text>
  <text x="24" y="1471" font-size="23" fill="#526159">Symbolic section · no car geometry or travel limits</text>
</svg>
