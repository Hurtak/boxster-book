<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="title desc">
<title id="title">Passive front strut and enlarged piston-valve section</title>
<desc id="desc">Photo-guided slender strut body, broad lower spring seat, threaded stem, piston rod, twin tubes, working piston and bottom valve. Oil passes the preset piston valves. Their resistance still depends on speed and direction. The enlargement shows rebound flow, not literal port dimensions.</desc>
