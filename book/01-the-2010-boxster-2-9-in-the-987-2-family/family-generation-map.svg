<svg xmlns="http://www.w3.org/2000/svg" width="600" height="510" viewBox="0 0 600 510" role="img" aria-labelledby="title desc">
<title id="title">Locate the 2010 2.9 within the generations</title><desc id="desc">The original 987 is grouped as 2005 to 2008. The revised 987.2 is grouped as 2009 to 2012 and contains the reference 2010 2.9. The succeeding 981 was introduced in 2012 and had a 2.7-litre ordinary model. These are generation groups, not registration rules.</desc>
<rect width="600" height="510" rx="10" fill="#f4f7f3"/>
<g font-family="sans-serif" fill="#263d34">
<text x="28" y="39" font-size="27" font-weight="bold">One type, two phases; then a successor</text>
<rect x="28" y="62" width="544" height="109" rx="8" fill="#e5ebe5"/>
<text x="48" y="99" font-size="27" font-weight="bold">987.1 · 2005–2008</text>
<text x="48" y="137" font-size="23">Earlier engines and automatic gearbox</text>
<path d="M300 179v23m-7-7 7 7 7-7" fill="none" stroke="#7c8f80" stroke-width="3"/>
<rect x="28" y="212" width="544" height="119" rx="8" fill="#176b53"/>
<text x="48" y="250" font-size="27" font-weight="bold" fill="white">987.2 · 2009–2012</text>
<text x="48" y="288" font-size="24" fill="white">Reference: 2010 Boxster 2.9</text>
<path d="M300 340v23m-7-7 7 7 7-7" fill="none" stroke="#7c8f80" stroke-width="3"/>
<rect x="28" y="374" width="544" height="91" rx="8" fill="#e5ebe5"/>
<text x="48" y="410" font-size="27" font-weight="bold">981 · introduced in 2012</text>
<text x="48" y="443" font-size="23">New generation; ordinary model 2.7</text>
<text x="28" y="493" font-size="20">Generation groups are not registration rules.</text>
</g></svg>
