<svg xmlns="http://www.w3.org/2000/svg" width="600" height="865" viewBox="0 0 600 865" role="img" aria-labelledby="title desc">
<title id="title">Boxster mid-engine packaging and rear-wheel drive</title>
<desc id="desc">Schematic side view of an open two-seat roadster facing left. Front luggage is ahead of the cabin; the engine is behind the seats and ahead of the rear axle. The transaxle is behind the engine, below the rear luggage area. Dashed lines locate the front and rear axles. A separate functional diagram shows engine torque passing through the transaxle, which combines the gearbox, final drive and differential, then through two driveshafts to the rear wheels. Component shapes, positions and routes are illustrative, not to scale.</desc>
<defs>
  <marker id="family-layout-torque" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#176b53"/></marker>
</defs>
<rect width="600" height="865" rx="10" fill="#f4f7f3"/>
<g font-family="sans-serif" fill="#263d34">
