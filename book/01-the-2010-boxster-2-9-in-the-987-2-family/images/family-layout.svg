<svg xmlns="http://www.w3.org/2000/svg" width="600" height="865" viewBox="0 0 600 865" role="img" aria-labelledby="title desc">
<title id="title">Boxster mid-engine packaging and rear-wheel drive</title>
<desc id="desc">Photo-guided side cutaway of the 2010 European/UK Boxster 987.2 2.9, facing left, with its roof lowered. Body length, wheelbase and nominal standard 17-inch wheel and tyre diameters share one scale. The long low nose, raked windscreen, shaped seat with integrated head restraint, fixed rear roll hoop and curved rear deck follow contemporary Porsche photographs. Front luggage is ahead of the two-seat cabin. The low flat-six engine sits immediately behind the seats, ahead of the rear axle; the manual transaxle extends rearwards below the rear luggage compartment. The body and rear wheel are transparent to reveal this arrangement. Internal outlines and installation positions are simplified, not factory CAD. A separate connection diagram traces torque from engine through gearbox, final drive and differential to both rear wheels.</desc>
<defs>
  <marker id="family-layout-torque" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#176b53"/></marker>
  <linearGradient id="family-layout-body" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dce6dd"/><stop offset="1" stop-color="#bdcfc1"/></linearGradient>
  <g id="family-layout-rim">
    <circle r="27.05" fill="#e5eae6" stroke="#6a7b72" stroke-width="1.5"/>
    <circle r="22.8" fill="#76877d"/>
    <circle r="17.3" fill="#b1beb5" stroke="#899b90" stroke-width="1"/>
    <g fill="#e5eae6" stroke="#b6c2b9" stroke-width=".5">
      <path id="family-layout-spoke" d="M-4-5-5.5-23-2-25-1-6ZM1-6 2-25 5.5-23 4-5Z"/>
      <use href="#family-layout-spoke" transform="rotate(72)"/><use href="#family-layout-spoke" transform="rotate(144)"/><use href="#family-layout-spoke" transform="rotate(216)"/><use href="#family-layout-spoke" transform="rotate(288)"/>
    </g>
    <circle r="6.5" fill="#d3ddd5" stroke="#6a7b72"/>
    <g fill="#64796b"><circle cy="-4.6" r=".9"/><circle cx="4.4" cy="-1.4" r=".9"/><circle cx="2.7" cy="3.7" r=".9"/><circle cx="-2.7" cy="3.7" r=".9"/><circle cx="-4.4" cy="-1.4" r=".9"/></g>
  </g>
</defs>
