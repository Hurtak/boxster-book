  <rect x="486" y="251" width="62" height="19" rx="4" fill="#91b6a3" stroke="#647d6a" stroke-width="2"/>
  <text x="447" y="211" text-anchor="middle" font-size="27">Transaxle</text>
  <path d="M447 221V277" fill="none" stroke="#647d6a" stroke-width="2"/>

  <g fill="none" stroke="#829888" stroke-width="2" stroke-dasharray="6 5">
