  <path d="M293 235V216Q293 203 305 203T317 216V237" fill="none" stroke="#536c5d" stroke-width="5"/>
  <path d="M203 281H288L298 244" fill="none" stroke="#a4b6a8" stroke-width="2"/>
  <g>
    <circle cx="112" cy="320" r="37" fill="#263d34"/><circle cx="112" cy="320" r="21" fill="#a4b6a8"/>
