<svg xmlns="http://www.w3.org/2000/svg" font-family="'Source Sans 3', Arial, sans-serif" role="img" aria-label="Rear-body cutaway: separate roof cover, boot lid and internal engine cover" viewBox="0 0 720 760">
  <title>Three spaces behind the seats, with different access covers</title>
  <desc>Photo-guided rear-half centre cutaway, front to the left, with a rear wheel shown beyond the section. The reclining seat and rollover bar locate the roof bay above the engine. The engine is ahead of the rear axle; the separate 130-litre rear boot is farther back. A shallow roof-compartment cover and a different rear boot lid follow the curved rear deck. The carpet, ribbed top engine cover and perimeter seal are together in the car and separated only in the detail below. A second detail shows the oil and coolant filler cup behind its small flap inside the boot. Shapes and section positions are approximate, not measured CAD or removal instructions.</desc>
