<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" role="img" aria-labelledby="title desc">
<title id="title">Three airflow jobs in the Boxster package</title>
<desc id="desc">Functional diagram. Front air passes through radiators and exits around the front underside. The left side supplies combustion air through the air cleaner. The right side supplies ventilation air to the engine compartment. Lines are connections, not precise streamlines.</desc>
<defs><marker id="body-air-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#357694"/></marker><marker id="body-air-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a35d32"/></marker></defs>
<rect width="600" height="460" fill="#f7f6f0"/>
<g font-family="sans-serif" fill="#253d32" font-size="25">
<text x="300" y="35" text-anchor="middle" font-size="28" font-weight="bold">Air has more than one destination</text>
<rect x="173" y="72" width="254" height="58" rx="6" fill="#dce8e8" stroke="#357694" stroke-width="2"/>
<text x="300" y="109" text-anchor="middle">Front radiators</text>
<path d="M28 100H155" stroke="#357694" stroke-width="5" marker-end="url(#body-air-blue)"/>
<path d="M444 100H539V151H372" stroke="#a35d32" stroke-width="5" fill="none" marker-end="url(#body-air-warm)"/>
<text x="76" y="82" text-anchor="middle" font-size="23">Nose</text>
<text x="300" y="185" text-anchor="middle" font-size="23">Warm air leaves the front region</text>
<path d="M24 212H576" stroke="#c9d3c8" stroke-width="2"/>
<rect x="26" y="245" width="177" height="62" rx="6" fill="#dce8e8" stroke="#357694" stroke-width="2"/>
<text x="114" y="282" text-anchor="middle">Left inlet</text>
<path d="M217 276H279" stroke="#357694" stroke-width="5" marker-end="url(#body-air-blue)"/>
<rect x="298" y="245" width="276" height="62" rx="6" fill="#e2e9df" stroke="#176b53" stroke-width="2"/>
<text x="436" y="282" text-anchor="middle">Air cleaner → engine</text>
<rect x="26" y="353" width="177" height="62" rx="6" fill="#dce8e8" stroke="#357694" stroke-width="2"/>
<text x="114" y="390" text-anchor="middle">Right inlet</text>
<path d="M217 384H279" stroke="#357694" stroke-width="5" marker-end="url(#body-air-blue)"/>
<rect x="298" y="345" width="276" height="78" rx="6" fill="#f1e2d3" stroke="#a35d32" stroke-width="2"/>
<text x="436" y="376" text-anchor="middle">Engine-bay</text><text x="436" y="405" text-anchor="middle">ventilation</text>
<text x="300" y="447" text-anchor="middle" font-size="21">Left and right are viewed facing forwards</text>
</g></svg>
