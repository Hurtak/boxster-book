<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1580" role="img" aria-labelledby="title desc">
<title id="title">Three airflow jobs in the Boxster body</title>
<desc id="desc">Reference-guided plan view of the ordinary 2010 Boxster 2.9, front at the top and vehicle left on the left. The long rounded body, wheels, two-seat cockpit and mid-engine position follow the 987.2 layout. Two separate cooling modules sit ahead of the front wheels. Each has an air guide, air-conditioning condenser, coolant radiator and rear fan. The left side opening feeds a moulded airbox and then the engine intake; the right opening feeds a separate duct and fan which ventilate the space around the engine. The engine is ahead of the rear axle; the rear boot is behind it. A separate side cutaway explains the front module stack. Body and wheel proportions use the UK brochure dimensions; internal profiles, locations, arrows and the opened-out stack remain illustrative, not factory CAD or measured airflow.</desc>
<defs>
  <marker id="body-air-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#357694"/></marker>
  <marker id="body-air-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a35d32"/></marker>
  <pattern id="body-air-fins" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 2H7M0 5H7" stroke="#6b8e99" stroke-width="1"/></pattern>
  <pattern id="body-air-filter" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M2 0V6" stroke="#7395a1" stroke-width="1.4"/></pattern>
  <!-- Module footprint in plan: broad front duct, two separate thin cores,
       and the rear shroud/fan seen edge-on. Not a fan lying flat on the car. -->
  <g id="body-air-front-module" stroke-linejoin="round">
    <path d="M-34 -27Q0 -36 34 -27L29 1H-29Z" fill="#c4d9dd" stroke="#357694" stroke-width="2"/>
    <path d="M-30 -11H30V-5H-30Z" fill="#a7c8d0" stroke="#357694" stroke-width="1.5"/>
    <path d="M-32 1H32V13H-32Z" fill="url(#body-air-fins)" stroke="#357694" stroke-width="2"/>
    <path d="M-27 15H27L22 30H-22Z" fill="#b7c9c9" stroke="#486d77" stroke-width="1.5"/>
    <ellipse cx="0" cy="25" rx="18" ry="5" fill="#728f94"/>
    <path d="M25 3H37V22M25 12H32V32" fill="none" stroke="#a35d32" stroke-width="3"/>
  </g>
</defs>
