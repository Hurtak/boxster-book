<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-labelledby="timeline-evidence-title timeline-evidence-desc">
  <title id="timeline-evidence-title">2010 calendar events</title>
  <desc id="timeline-evidence-desc">The selected reference year, 2010, contains a January UK ordinary-model brochure and the February Spyder introduction planned in Porsche's November 2009 Dutch announcement. That prospective date is not a first-delivery record. Porsche Classic's later 2011 Spyder heading is a different date label.</desc>
  <rect width="400" height="470" fill="#f5f3eb"/>
  <g font-family="'Source Sans 3', sans-serif" fill="#233e33">
    <text x="20" y="38" font-size="26" font-weight="700">2010 · Calendar events</text>
    <path d="M42 79H358" stroke="#9ba99f" stroke-width="3"/>
    <g fill="#637e6d">
      <circle cx="42" cy="79" r="5"/><circle cx="121" cy="79" r="5"/>
      <circle cx="279" cy="79" r="5"/><circle cx="358" cy="79" r="5"/>
    </g>
    <circle cx="200" cy="79" r="10" fill="#233e33"/>
    <g font-size="18" text-anchor="middle">
      <text x="42" y="109">2008</text><text x="121" y="109">2009</text>
      <text x="200" y="109" font-weight="700">2010</text>
      <text x="279" y="109">2011</text><text x="358" y="109">2012</text>
    </g>
    <rect x="20" y="134" width="360" height="112" fill="#e1e8df"/>
    <text x="34" y="164" font-size="20" font-weight="700">January · UK</text>
    <text x="34" y="193" font-size="20">Reference brochure published</text>
    <text x="34" y="222" font-size="18">Ordinary Boxster and S</text>
    <rect x="20" y="261" width="360" height="112" fill="#e1e8df"/>
    <text x="34" y="291" font-size="20" font-weight="700">February · Netherlands</text>
    <text x="34" y="320" font-size="20">Planned Spyder introduction</text>
    <text x="34" y="349" font-size="18">Announced November 2009</text>
    <text x="20" y="412" font-size="18">Later Porsche Classic heading:</text>
    <text x="20" y="444" font-size="20">“2011” is a different date label.</text>
  </g>
</svg>
