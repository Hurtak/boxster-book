  <path d="M90 172H181M229 172H320" fill="none" stroke="#a96b24" stroke-width="3.5" stroke-linejoin="round" />
  <circle cx="205" cy="172" r="24" fill="#fff0a7" stroke="#a96b24" stroke-width="3" />
  <path d="M189 156L221 188M189 188L221 156" fill="none" stroke="#a96b24" stroke-width="3.5" stroke-linejoin="round" />
