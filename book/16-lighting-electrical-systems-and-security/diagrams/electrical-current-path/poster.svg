  <path d="M154 86H253" fill="none" stroke="#a96b24" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M291 86H320V292" fill="none" stroke="#a96b24" stroke-width="3.5" stroke-linejoin="round" />
  <rect x="116" y="76" width="38" height="20" rx="3" fill="#f1f5ef" stroke="#39765b" stroke-width="2" />
  <path d="M121 86H149" fill="none" stroke="#a96b24" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M253 86H291" fill="none" stroke="#a96b24" stroke-width="3.5" stroke-linejoin="round" />
  <circle cx="253" cy="86" r="3" fill="#39765b" />
  <circle cx="291" cy="86" r="3" fill="#39765b" />
  <text x="135" y="47" text-anchor="middle" font-size="18" fill="#243d32">Fuse</text>
  <text x="135" y="70" text-anchor="middle" font-size="16" fill="#243d32">intact</text>
  <text x="272" y="47" text-anchor="middle" font-size="18" fill="#243d32">Switch</text>
  <text x="272" y="70" text-anchor="middle" font-size="16" fill="#243d32">closed</text>
  <path d="M-6 -6L3 0L-6 6" transform="translate(203.5,86) rotate(0)" fill="none" stroke="#a96b24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="current-arrow" />
  <path d="M-6 -6L3 0L-6 6" transform="translate(320,125) rotate(90)" fill="none" stroke="#a96b24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="current-arrow" />
  <path d="M90 172V374M90 398V405H38V219" fill="none" stroke="#39765b" stroke-width="3.5" stroke-linejoin="round" />
  <path d="M90 374V398" fill="none" stroke="#39765b" stroke-width="3.5" stroke-linejoin="round" />
