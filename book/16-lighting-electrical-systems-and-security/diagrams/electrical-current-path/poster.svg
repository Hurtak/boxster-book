<svg xmlns="http://www.w3.org/2000/svg" font-family="'Source Sans 3', sans-serif" role="img" viewBox="0 0 342 565" aria-labelledby="title desc">
  <title id="title">A complete teaching circuit supplies one lamp</title>
  <desc id="desc">An ideal 12 volt battery supplies one illustrative 24 watt lamp through an intact fuse and a closed switch. Conventional current travels from battery positive through the lamp, then back through the shared earth return to battery negative. Current is 2 amperes. The dashed second branch is not connected. This functional teaching schematic does not show Porsche wiring or lamp ratings.</desc>
  <rect width="342" height="565" rx="12" fill="#f8faf7" />
  <text x="171" y="20" text-anchor="middle" font-size="17" fill="#243d32">Conventional current: + → −</text>
