  <text x="64" y="259" text-anchor="middle" font-size="18" fill="#243d32">12 V</text>
  <text x="64" y="282" text-anchor="middle" font-size="16" fill="#243d32">ideal</text>
  <text x="110" y="391" text-anchor="start" font-size="18" fill="#39765b">Shared earth return</text>
  <text x="110" y="415" text-anchor="start" font-size="16" fill="#243d32">Back to battery −</text>
  <text x="171" y="463" text-anchor="middle" font-size="23" fill="#243d32">Supply current: 2 A</text>
  <text x="171" y="491" text-anchor="middle" font-size="18" fill="#243d32">24 W ÷ 12 V = 2 A</text>
  <text x="171" y="532" text-anchor="middle" font-size="16" fill="#53695b">Ideal lamp values, not Porsche ratings.</text>
  <text x="171" y="554" text-anchor="middle" font-size="16" fill="#53695b">Teaching circuit, not vehicle wiring.</text>
</svg>
