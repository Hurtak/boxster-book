<svg xmlns="http://www.w3.org/2000/svg" width="800" height="790" viewBox="0 0 800 790" role="img" aria-labelledby="title desc">
<title id="title">Photo-guided 2.9 intake assembly — Low range</title>
<desc id="desc">A broad ribbed centre distributor joins two three-runner bank modules through oval sleeve and clamp joints. Two vacuum actuators sit on the centre assembly. The separate enlarged half-oval flap sections show distribution closed and tuning closed. Internal routes and dimensions are illustrative.</desc>
