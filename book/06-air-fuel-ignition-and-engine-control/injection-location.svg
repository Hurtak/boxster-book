<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" role="img" aria-labelledby="injection-title injection-desc">
<title id="injection-title">Port injection and direct injection place fuel differently</title><desc id="injection-desc">The 2.9 sprays fuel into the inlet port at about 4 bar, before the inlet valve. The 3.4 DFI engine sprays fuel directly into the cylinder at 40 to 120 bar. Both are electronically metered.</desc>
<defs><marker id="injection-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#276950"/></marker><marker id="injection-fuel" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b56a31"/></marker></defs>
<rect width="600" height="470" fill="#f4f5ef"/>
<g font-family="sans-serif" fill="#202d27">
<text x="26" y="36" font-size="26">2.9: mix in the inlet port</text>
<path d="M30 129H195L260 180H559" fill="none" stroke="#9fb3a4" stroke-width="55"/>
<path d="M30 129H190L260 180H555" fill="none" stroke="#276950" stroke-width="3" marker-end="url(#injection-arrow)"/>
<path d="M136 68V119" fill="none" stroke="#b56a31" stroke-width="8" marker-end="url(#injection-fuel)"/>
<text x="163" y="88" font-size="23" fill="#925326">Fuel ≈ 4 bar</text>
<path d="M318 151L342 205" stroke="#202d27" stroke-width="8"/>
<text x="285" y="238" font-size="22">Inlet valve</text><text x="447" y="144" font-size="23">Cylinder</text>
<text x="26" y="290" font-size="26">3.4 DFI: mix in the cylinder</text>
<path d="M30 380H555" fill="none" stroke="#9fb3a4" stroke-width="55"/>
<path d="M30 380H552" fill="none" stroke="#276950" stroke-width="3" marker-end="url(#injection-arrow)"/>
<path d="M318 351L342 405" stroke="#202d27" stroke-width="8"/>
<path d="M487 309V367" fill="none" stroke="#b56a31" stroke-width="8" marker-end="url(#injection-fuel)"/>
<text x="240" y="440" font-size="22">Inlet valve</text><text x="380" y="440" font-size="22" fill="#925326">Fuel 40–120 bar</text>
</g></svg>