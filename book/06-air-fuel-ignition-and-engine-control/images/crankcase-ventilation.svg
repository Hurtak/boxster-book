<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc" font-family="sans-serif">
<title id="title">Recover oil mist before recirculating blow-by</title><desc id="desc">Combustion gas leaking past the piston rings enters the crankcase as blow-by. The ventilation route leads through pre- and fine oil separation. Ventilated gas returns to the intake for combustion, while separated oil returns to the engine oil collection. The carbon canister and liquid oil-pressure supply are different systems. Functional paths are shown, not separator internals or exact hose geometry.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="900" fill="#f1f4f2"/>
<text x="300" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#243a32">Crankcase gases and recovered oil</text><rect x="80" y="84" width="440" height="82" rx="4" fill="#dce8e1"/><text x="300.0" y="133.32" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">Combustion chamber</text><path d="M300 166V220" fill="none" stroke="#28647d" stroke-width="4" marker-end="url(#arrow)"/><text x="40" y="203" text-anchor="start" font-size="23" font-weight="normal" fill="#28647d">Past piston rings</text><rect x="80" y="232" width="440" height="80" rx="4" fill="#dce8e1"/><text x="300.0" y="280.32" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">Crankcase · blow-by + oil mist</text><path d="M300 312V365" fill="none" stroke="#28647d" stroke-width="4" marker-end="url(#arrow)"/><rect x="80" y="377" width="440" height="104" rx="4" fill="#dce8e1"/><text x="300.0" y="420.82" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">Oil separation</text>
<text x="300.0" y="453.82" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">Pre-separator + fine separator</text><path d="M180 481V550" fill="none" stroke="#885c2c" stroke-width="4" marker-end="url(#arrow)"/><path d="M420 481V550" fill="none" stroke="#28647d" stroke-width="4" marker-end="url(#arrow)"/><rect x="35" y="563" width="250" height="100" rx="4" fill="#dce8e1"/><text x="160.0" y="605.18" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Separated oil</text>
<text x="160.0" y="636.18" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">returns to engine</text><rect x="315" y="563" width="250" height="100" rx="4" fill="#dce8e1"/><text x="440.0" y="605.18" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Ventilated gas</text>
<text x="440.0" y="636.18" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">returns to intake</text><path d="M160 663V719" fill="none" stroke="#885c2c" stroke-width="4" marker-end="url(#arrow)"/><path d="M440 663V719" fill="none" stroke="#28647d" stroke-width="4" marker-end="url(#arrow)"/><rect x="35" y="733" width="250" height="76" rx="4" fill="#dce8e1"/><text x="160.0" y="778.68" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Oil collection</text><rect x="315" y="733" width="250" height="76" rx="4" fill="#dce8e1"/><text x="440.0" y="778.68" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Combustion</text><text x="300" y="856" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Controlled ventilation · no pressure scale</text>
</svg>
