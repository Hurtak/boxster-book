<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 960" role="img" aria-labelledby="title desc" font-family="sans-serif">
<title id="title">Liquid fuel and captured vapour take separate paths</title><desc id="desc">The front fuel tank supplies a pump/filter/regulator group. A pressurised liquid feed runs to the rear engine, fuel distribution and six inlet-port injectors. Separately, tank vapour reaches an activated-carbon canister; controlled purge carries vapour to the intake for combustion. The groups explain functions rather than a pump-module assembly or an emission-market-specific leak-test system.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="960" fill="#f1f4f2"/>
<text x="300" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#243a32">Two paths from the fuel tank</text><rect x="80" y="85" width="440" height="78" rx="4" fill="#dce8e1"/><text x="300.0" y="132.32" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">Front fuel tank + level sender</text><path d="M180 163V217" fill="none" stroke="#885c2c" stroke-width="4" marker-end="url(#arrow)"/><path d="M420 163V217" fill="none" stroke="#28647d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="225" width="260" height="130" rx="4" fill="#dce8e1"/><text x="160.0" y="266.68" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Liquid fuel</text>
<text x="160.0" y="297.68" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Electric pump</text>
<text x="160.0" y="328.68" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Filter / regulator</text><rect x="320" y="225" width="250" height="130" rx="4" fill="#dce8e1"/><text x="445.0" y="266.68" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Fuel vapour</text>
<text x="445.0" y="297.68" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Activated-carbon</text>
<text x="445.0" y="328.68" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">canister</text><path d="M160 355V420" fill="none" stroke="#885c2c" stroke-width="4" marker-end="url(#arrow)"/><path d="M445 355V420" fill="none" stroke="#28647d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="430" width="260" height="105" rx="4" fill="#dce8e1"/><text x="160.0" y="474.68" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Pressurised feed</text>
<text x="160.0" y="505.68" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">to rear engine</text><rect x="320" y="430" width="250" height="105" rx="4" fill="#dce8e1"/><text x="445.0" y="474.68" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Purge line</text>
<text x="445.0" y="505.68" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">+ control valve</text><path d="M160 535V600" fill="none" stroke="#885c2c" stroke-width="4" marker-end="url(#arrow)"/><path d="M445 535V600" fill="none" stroke="#28647d" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="610" width="260" height="105" rx="4" fill="#dce8e1"/><text x="160.0" y="654.68" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Distribution pipes</text>
<text x="160.0" y="685.68" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">+ six port injectors</text><rect x="320" y="610" width="250" height="105" rx="4" fill="#dce8e1"/><text x="445.0" y="654.68" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Intake air path</text>
<text x="445.0" y="685.68" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">to engine</text><path d="M160 715V780H300" fill="none" stroke="#885c2c" stroke-width="4" marker-end="url(#arrow)"/><path d="M445 715V780H300" fill="none" stroke="#28647d" stroke-width="4" marker-end="url(#arrow)"/><path d="M300 780V796" fill="none" stroke="#17654c" stroke-width="4" marker-end="url(#arrow)"/><rect x="100" y="802" width="400" height="76" rx="4" fill="#dce8e1"/><text x="300.0" y="848.32" text-anchor="middle" font-size="26" font-weight="normal" fill="#243a32">Charge enters cylinders</text><text x="300" y="919" text-anchor="middle" font-size="22" font-weight="normal" fill="#243a32">Liquid: pressure + metering</text>
<text x="300" y="948" text-anchor="middle" font-size="22" font-weight="normal" fill="#243a32">Vapour: storage + controlled purge</text>
</svg>
