<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="title desc" font-family="sans-serif">
<title id="title">Rim width and positive offset</title>
<desc id="desc">The rim centre plane is inside the mounting face. Positive offset measures the distance between them. Reducing offset from 55 to 45 millimetres moves the rim outwards 10 millimetres at the same width and fixed hub face.</desc>
<rect width="600" height="430" fill="#f5f5ee"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17654c"/></marker></defs>
<g fill="#233c31" font-size="22" text-anchor="middle"><text x="140" y="31">Inside</text><text x="475" y="31">Outside →</text></g>
<g fill="none" stroke-linejoin="round">
<path d="M160 107V283H185V270H385V283H410V107H385V120H185V107Z" stroke="#233c31" stroke-width="7" fill="#e6e8df"/>
<path d="M172 107V283H197V270H397V283H422V107H397V120H197V107Z" stroke="#277c84" stroke-width="3" stroke-dasharray="7 6"/>
<path d="M285 88V319" stroke="#77887b" stroke-width="2" stroke-dasharray="5 6"/>
<path d="M351 85V319" stroke="#17654c" stroke-width="4"/>
<path d="M351 169H425V221H351" stroke="#17654c" stroke-width="8" fill="#d3e2d6"/>
<path d="M285 83H351" stroke="#17654c" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M185 305H385" stroke="#17654c" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M432 198H500V247" stroke="#67796b" stroke-width="2"/>
</g>
<g fill="#233c31" font-size="22" text-anchor="middle">
<text x="318" y="66">+55 mm</text>
<text x="285" y="335">Rim width</text>
<text x="285" y="363" font-size="20">Centre plane</text>
<text x="500" y="270" font-size="20">Hub face</text>
<text x="300" y="401" font-size="20" fill="#277c84">Dashed: +45 mm → rim moves out 10 mm</text>
</g>
</svg>
