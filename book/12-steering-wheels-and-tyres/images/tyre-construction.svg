<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc" data-section-width="400" data-section-height="220">
<title id="title">A tyre is a tensioned structure</title>
<desc id="desc">Symmetrical transverse section through a generic tubeless radial tyre on a shaped rim. Numbered arrows identify the tread, two steel belt layers, the casing turning around the bead, the inner liner and the bead wire core. Broad crown, rounded shoulders and bulging sidewalls follow manufacturer construction illustrations. Overall height-to-width uses a nominal 55-percent profile; layer thickness and the bead detail are enlarged.</desc>
