<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 670" role="img" aria-labelledby="title desc" font-family="sans-serif">
<title id="title">Slip angle is the angle between pointing and travel</title><desc id="desc">Top view of one conceptual tyre: its wheel plane points slightly left of its upward travel direction. The small angle between those directions is slip angle. A separate lateral force arrow acts left. Tread deformation permits cornering force before the complete patch slides; this does not prescribe a real Boxster tyre angle, force or operating limit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="600" height="670" fill="#f1f4f2"/>
<text x="300" y="44" text-anchor="middle" font-size="27" font-weight="bold" fill="#243a32">Pointing direction and travel differ</text><path d="M300 480V133" fill="none" stroke="#28647d" stroke-width="5" marker-end="url(#arrow)"/><g transform="rotate(-15 300 400)"><rect x="245" y="280" width="110" height="245" rx="20" fill="#243a32"/><path d="M300 550V130" fill="none" stroke="#17654c" stroke-width="5" marker-end="url(#arrow)"/></g><path d="M300 231A169 169 0 0 0 256 237" fill="none" stroke="#885c2c" stroke-width="5"/><text x="407" y="160" text-anchor="middle" font-size="26" font-weight="normal" fill="#28647d">Actual</text>
<text x="407" y="193" text-anchor="middle" font-size="26" font-weight="normal" fill="#28647d">travel</text><text x="145" y="134" text-anchor="middle" font-size="26" font-weight="normal" fill="#17654c">Wheel</text>
<text x="145" y="167" text-anchor="middle" font-size="26" font-weight="normal" fill="#17654c">points</text><text x="350" y="266" text-anchor="middle" font-size="24" font-weight="normal" fill="#885c2c">Slip</text>
<text x="350" y="297" text-anchor="middle" font-size="24" font-weight="normal" fill="#885c2c">angle</text><path d="M237 408H80" fill="none" stroke="#17654c" stroke-width="4" marker-end="url(#arrow)"/><text x="145" y="457" text-anchor="middle" font-size="24" font-weight="normal" fill="#17654c">Lateral</text>
<text x="145" y="488" text-anchor="middle" font-size="24" font-weight="normal" fill="#17654c">force</text><text x="300" y="595" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Top view · angle exaggerated</text>
<text x="300" y="626" text-anchor="middle" font-size="24" font-weight="normal" fill="#243a32">Tyre deformation supplies the force</text>
</svg>
