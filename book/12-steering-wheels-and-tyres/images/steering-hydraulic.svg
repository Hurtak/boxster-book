    <path d="M280 264L286 256L293 261L303 259L305 253L316 257L314 264L322 272L330 272L331 283L323 286L320 295L323 301L313 308L308 302L297 304L294 310L283 306L285 299L278 292L270 291L270 279L278 276Z" fill="#adbdab" stroke-width="3"/>
