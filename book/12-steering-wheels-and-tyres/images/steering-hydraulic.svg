    <path d="M100 313H251L257 303L265 313L273 303L281 313L289 303L297 313L305 303L313 313L321 303L329 313L337 303L345 313H500V331H100Z" fill="#d9dfd4" stroke-width="3"/>
    <path d="M100 322H80L70 411M500 322H520L530 411" stroke-width="7"/>
