    <rect x="296" y="1061" width="18" height="122" fill="#17654c" stroke="#233c31" stroke-width="2"/>
    <path d="M305 1044V1061" stroke="#67796b" stroke-width="2"/>
    <path d="M190 1225H410" stroke="#17654c" stroke-width="5" marker-end="url(#s23-pressure-arrow)"/>
  </g>
  <g font-size="26" text-anchor="middle">
    <g fill="#233c31">
      <text x="139" y="772">Reservoir</text>
      <text x="461" y="754">Pump</text>
      <text x="461" y="789">belt driven</text>
      <text x="300" y="742">Feed</text>
      <text x="300" y="918">Control valve</text>
      <text x="300" y="952" font-size="24">responds to effort</text>
      <text x="305" y="1037">Piston</text>
    </g>
    <text x="532" y="860" fill="#17654c">Supply</text>
    <text x="68" y="860" fill="#277c84">Return</text>
    <g fill="#17654c">
      <text x="190" y="1097">Higher</text>
      <text x="190" y="1129">pressure</text>
      <text x="300" y="1272">Assists rack movement</text>
    </g>
    <g fill="#277c84">
      <text x="415" y="1097">Lower</text>
      <text x="415" y="1129">pressure</text>
    </g>
    <g fill="#233c31">
      <text x="300" y="1326">Pressure pushes a piston</text>
      <text x="300" y="1360">fixed to the sliding rack.</text>
      <text x="300" y="1402" font-size="24">Reverse input swaps the chambers.</text>
      <text x="300" y="1434" font-size="22">No effort: little pressure imbalance.</text>
      <text x="300" y="1466" font-size="22">Conceptual; not factory hose routing.</text>
    </g>
  </g>
</svg>
