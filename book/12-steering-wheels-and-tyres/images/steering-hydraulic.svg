    <rect x="50" y="401" width="42" height="90" rx="9" fill="#38443d" stroke-width="3" transform="rotate(-18 71 446)"/>
    <rect x="510" y="401" width="42" height="90" rx="9" fill="#38443d" stroke-width="3" transform="rotate(-18 531 446)"/>
    <path d="M236 353H366" stroke-width="3" marker-end="url(#s23-mechanical-arrow)"/>
    <path d="M218 431L145 397L75 366.5M382 431L455 397L525 366.5" stroke="#67796b" stroke-width="2"/>
    <path d="M222 238H278M342 283H331M338 199H320L300 190" stroke="#67796b" stroke-width="2"/>
  </g>
  <g fill="#233c31" font-size="26">
    <text x="348" y="206">Column</text>
    <text x="42" y="245">Control valve</text>
    <text x="350" y="290">Pinion</text>
    <g text-anchor="middle">
      <text x="300" y="389">Rack slides</text>
      <text x="300" y="446">Track rods</text>
      <text x="300" y="526">Front wheel carriers turn</text>
      <text x="300" y="566" font-size="24">Mechanical link sets wheel direction.</text>
    </g>
  </g>
  <path d="M32 591H568" stroke="#c9d2c7" stroke-width="2"/>
  <g fill="#233c31" text-anchor="middle">
    <text x="300" y="637" font-size="28">2 · Hydraulic assistance</text>
    <text x="300" y="678" font-size="26">Same rack: moving right</text>
  </g>
  <!-- Solid green: pressure supply in this state. Dashed teal: feed/return. -->
