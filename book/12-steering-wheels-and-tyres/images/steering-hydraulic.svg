<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1480" role="img" aria-labelledby="title desc" font-family="sans-serif">
  <title id="title">Mechanical steering with hydraulic rack assistance</title>
  <desc id="desc">Two functional views of the same steering system. The steering wheel and column turn a pinion meshing with a sliding rack; track rods connect the rack to the front wheel carriers. An engine-belt-driven pump draws fluid from a reservoir and supplies a control valve responding to driver effort. In the illustrated rightward rack movement, the valve supplies the left assist chamber at higher pressure and returns fluid displaced from the lower-pressure right chamber to the reservoir. The pressure difference pushes a piston fixed to the rack. Opposite input swaps the chambers; without steering effort there is little pressure imbalance. This is a conceptual mechanism, not the Porsche's factory hose routing, valve geometry or wheel-angle relationship.</desc>
  <!-- Porsche 987.2 architecture: PET illustrations 101-010 and 403-000/001/003.
       Generic valve/power-cylinder principle: Bosch Hydraulic Power Steering — Rack and Pinion.
       Deliberately separated functional views, not an installation or service drawing. -->
  <defs>
    <marker id="s23-mechanical-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#233c31"/>
    </marker>
    <marker id="s23-pressure-arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="15" markerHeight="15" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L12 6L0 12Z" fill="#17654c"/>
    </marker>
    <marker id="s23-return-arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="15" markerHeight="15" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L12 6L0 12Z" fill="#277c84"/>
    </marker>
  </defs>
